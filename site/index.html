<title>트리즈엔 홈페이지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&family=Nanum+Brush+Script&display=swap">
<style>
/* Layout: full-bleed dark ink bands alternate with white/mist bands; 1280px content column; admin = fixed sidebar + work area.
   Single deliberate light look (brand site), colors set explicitly. */
:root{
  color-scheme: light;
  --ink:#0B0A45;        /* logo navy */
  --ink-2:#15135C;
  --ink-3:#221F78;
  --violet:#5230C2;     /* logo violet */
  --violet-soft:#9C86F0;
  --lilac:#EFEBFC;
  --paper:#FFFFFF;
  --mist:#F6F5FB;
  --line:#E5E3F0;
  --line-2:#D3D0E3;
  --text:#17162E;
  --muted:#6C6A86;
  --on-dark:#FFFFFF;
  --on-dark-2:rgba(255,255,255,.66);
  --on-dark-line:rgba(255,255,255,.14);
  --ok:#1E8A5A; --danger:#C93B3B; --warn:#B7791F;
  --f-display:"Sora","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wrap:1280px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.7;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.wrap{max-width:calc(var(--wrap) + 96px);margin:0 auto;padding-left:max(24px,var(--gut));padding-right:max(24px,var(--gut-r))}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--violet)}
.dark .eyebrow{color:var(--violet-soft)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border:1px solid transparent;font-size:15px;font-weight:500;transition:background .25s var(--ease),color .25s,border-color .25s,transform .25s var(--ease);white-space:nowrap}
.btn svg{transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{background:var(--ink-3)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:var(--violet)}
.btn-line{border-color:var(--line-2);background:var(--paper);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.btn-ghost:hover{background:#fff;color:var(--ink)}
.btn-sm{padding:9px 14px;font-size:13px}

/* ---------- placeholder visual (no image uploaded yet) ---------- */
.vis{position:relative;overflow:hidden;background:var(--ink)}
.vis img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;background:
  radial-gradient(120% 90% at var(--px,80%) var(--py,10%), rgba(82,48,194,.85), transparent 60%),
  linear-gradient(var(--pa,135deg), var(--ink-3), var(--ink) 70%)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 64px)}
.ph::after{content:"";position:absolute;right:-6%;top:-10%;width:46%;aspect-ratio:1;max-width:100%;
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0));
  clip-path:polygon(40% 0,100% 0,100% 62%,60% 100%,60% 30%,0 30%)}

/* ---------- header ---------- */
.hd{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;transition:background .35s var(--ease),box-shadow .35s,color .35s;color:#fff}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:24px}
.hd .logo img{height:30px;width:auto;display:block}
.hd .logo .l-dark{display:none}
.hd.solid{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hd.solid .logo .l-dark{display:block}.hd.solid .logo .l-white{display:none}
.hd.solid .hd-in{height:72px}
.gnb{display:flex;gap:clamp(20px,3.4vw,52px)}
.gnb a{font-size:16px;font-weight:500;position:relative;padding:8px 0}
.gnb a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.gnb a:hover::after,.gnb a.on::after{transform:scaleX(1)}
.hd-util{display:flex;align-items:center;gap:18px;font-size:13px}
.lang{font-family:var(--f-display);letter-spacing:.08em;opacity:.85;white-space:nowrap}
.lang button{background:none;border:0;color:inherit;font:inherit;letter-spacing:inherit;padding:4px 2px;opacity:.55;cursor:pointer}
.lang button.on{opacity:1;font-weight:700;text-decoration:underline;text-underline-offset:5px}
.fm-lang{margin-left:auto;margin-right:20px;font-size:13px}
/* preview / pending-changes bar (admins only) */
.pv-bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:150;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;max-width:calc(100vw - 32px);background:var(--ink);color:#fff;padding:10px 12px 10px 18px;border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,0,0,.55);font-size:13px;font-family:var(--f-body)}
.pv-bar .dot{width:8px;height:8px;border-radius:50%;background:#FFB547;flex:none}
.pv-bar b{font-weight:700}
.pv-bar button,.pv-bar a{border:1px solid rgba(255,255,255,.3);background:none;color:#fff;border-radius:999px;padding:7px 14px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
.pv-bar .go{background:#fff;color:var(--ink);border-color:#fff}
.pv-bar .go:hover{background:var(--lilac)}
.pv-list{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(20px,env(safe-area-inset-bottom,0px)) + 64px);z-index:150;width:min(520px,calc(100vw - 32px));max-height:50vh;overflow:auto;background:var(--paper);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,0,0,.4)}
.pv-list .r{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:13px}
.pv-list .r:last-child{border-bottom:0}
.pv-list .r span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv-mark{outline:2px dashed #FFB547;outline-offset:4px}
.badge.wait{background:#FFF3DC;color:#9A5B00}
.lang-tabs{display:flex;gap:4px;background:var(--mist);padding:4px;border-radius:8px;width:max-content}
.lang-tabs button{border:0;background:none;padding:7px 16px;border-radius:6px;font-size:13px;color:var(--muted);cursor:pointer}
.lang-tabs button.on{background:var(--paper);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.drafts-panel .r{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 22px;border-bottom:1px solid var(--line)}
.drafts-panel .r:last-child{border-bottom:0}
.support-btn{border:1px solid currentColor;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:.9;transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.support-btn:hover{background:var(--violet);border-color:var(--violet);color:#fff;opacity:1}
.slide video{width:100%;height:100%;object-fit:cover;display:block}
.vis video{width:100%;height:100%;object-fit:cover;display:block}
.vision{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.vision div{background:var(--paper);padding:36px 32px;display:grid;gap:12px;align-content:start}
.vision .n{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet)}
.vision b{font-size:20px;color:var(--ink)}
.vision p{color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr));gap:24px}
.tile{position:relative;overflow:hidden;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px}
.tile .vis{position:absolute;inset:0}
.tile .vis .ph{transition:transform .8s var(--ease)}
.tile:hover .vis .ph{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.1),rgba(11,10,69,.75))}
.tile>*:not(.vis){position:relative;z-index:2}
.tile h3{font-size:clamp(22px,2.2vw,28px);margin:10px 0 6px}
.tile p{color:var(--on-dark-2);font-size:15px}
.tile .go{margin-top:20px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.film{position:relative;overflow:hidden;color:#fff;background:var(--ink);min-height:clamp(440px,52vw,680px);display:flex;align-items:flex-end}
.film>.vis{position:absolute;inset:0}
.film>.vis video,.film>.vis img{transform:scale(1.04)}
.film::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,69,.9),rgba(11,10,69,.35) 70%);pointer-events:none;transition:opacity .5s}
.film .wrap{position:relative;z-index:2;width:100%;padding-block:72px;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
.film h2{font-size:clamp(28px,3.4vw,46px);font-weight:700;margin:14px 0 14px;line-height:1.3;max-width:24ch;white-space:pre-line}
.film p{color:var(--on-dark-2);max-width:56ch;white-space:pre-line}
.play{width:112px;height:112px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.06);backdrop-filter:blur(6px);color:#fff;display:grid;place-items:center;position:relative;flex:none;transition:background .3s,transform .3s var(--ease)}
.play::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:1px solid rgba(156,134,240,.5);animation:ring 2.4s var(--ease) infinite}
@keyframes ring{from{transform:scale(.85);opacity:1}to{transform:scale(1.25);opacity:0}}
.play:hover{background:var(--violet);transform:scale(1.05)}
.play small{position:absolute;top:calc(100% + 16px);left:50%;transform:translateX(-50%);font-family:var(--f-display);font-size:11px;letter-spacing:.24em;white-space:nowrap;opacity:.75}
.film-modal{position:fixed;inset:0;z-index:110;background:rgba(5,4,30,.92);display:grid;place-items:center;padding:max(56px,env(safe-area-inset-top,0px)) var(--gut-r) 24px var(--gut);animation:fade .3s}
.film-modal video{width:min(1200px,100%);max-height:80vh;background:#000;box-shadow:0 30px 80px -20px rgba(0,0,0,.6)}
.film-modal .x{position:absolute;top:max(16px,env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:none;color:#fff;display:grid;place-items:center}
.hero-pause{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center;font-size:11px}
@media (max-width:760px){.play{width:84px;height:84px}.film .wrap{padding-block:48px}}
.rich{display:grid;grid-template-columns:minmax(0,1fr);gap:clamp(72px,8vw,120px)}
.rich>section{min-width:0}
.rs-hd{margin-bottom:36px}
.rs-hd h3{font-size:clamp(26px,2.8vw,38px);font-weight:700;color:var(--ink);margin-top:12px;line-height:1.3}
.rs-p{color:#4A4868;max-width:72ch;font-size:17px;line-height:1.9;margin-bottom:16px}
.rs-p b,.rs-card b{color:var(--violet);font-weight:700}
.rs-quote{font-size:clamp(22px,2.4vw,32px);font-weight:700;color:var(--ink);line-height:1.55;border-left:3px solid var(--violet);padding:4px 0 4px 28px;margin:8px 0 24px;max-width:36ch}
.rs-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:20px}
.rs-card{border:1px solid var(--line);padding:30px 28px;background:var(--paper);display:grid;gap:12px;align-content:start;transition:border-color .3s var(--ease),transform .3s var(--ease)}
.rs-card:hover{border-color:var(--violet);transform:translateY(-3px)}
.rs-card h4{font-size:19px;font-weight:700;color:var(--ink);line-height:1.45}
.rs-card .n{font-family:var(--f-display);font-size:12px;letter-spacing:.2em;color:var(--violet)}
.rs-card p{color:#4A4868;font-size:15px}
.rs-card ul,.rs-list{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.rs-card li,.rs-list li{position:relative;padding-left:16px;color:#4A4868;font-size:15px;line-height:1.7}
.rs-card li::before,.rs-list li::before{content:"";position:absolute;left:0;top:.72em;width:6px;height:6px;border-radius:50%;background:var(--violet)}
.rs-steps .rs-cards{counter-reset:st;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr))}
.rs-steps .rs-card{background:var(--mist);border-color:transparent;border-top:2px solid var(--ink)}
.rs-feat .rs-cards{grid-template-columns:repeat(auto-fill,minmax(min(280px,100%),1fr))}
.rs-feat .rs-card{background:var(--ink);border-color:var(--ink);color:#fff}
.rs-feat .rs-card h4{color:#fff}.rs-feat .rs-card .n{color:var(--violet-soft)}
.rs-feat .rs-card li,.rs-feat .rs-card p{color:var(--on-dark-2)}
.rs-feat .rs-card li::before{background:var(--violet-soft)}
.rs-case .rs-cards{grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr))}
.rs-chips{display:flex;flex-wrap:wrap;gap:10px}
.rs-chip{border:1px solid var(--line-2);border-radius:999px;padding:12px 22px;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper)}
.rs-table{overflow-x:auto;border-top:2px solid var(--ink)}
.rs-table table{width:100%;border-collapse:collapse;min-width:640px}
.rs-table th{background:var(--mist);font-weight:500;font-size:14px;padding:16px 14px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.rs-table td{padding:16px 14px;border-bottom:1px solid var(--line);font-size:14px;color:#3A385C;vertical-align:top}
.rs-table td.c,.rs-table th.c{text-align:center}
.rs-table td .dot{color:var(--violet);font-size:16px}
.biz-intro{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(40px,6vw,96px);align-items:end}
.biz-intro h2{font-size:clamp(30px,3.6vw,50px);font-weight:700;color:var(--ink);line-height:1.25;margin-top:14px}
.biz-intro .lead{font-size:clamp(19px,1.7vw,23px);line-height:1.7;color:var(--ink);font-weight:500;white-space:pre-line}
.biz-intro .lead b{color:var(--violet)}
.biz-intro .body{color:#4A4868;margin-top:20px;white-space:pre-line}
.biz-diagram{margin-top:clamp(56px,6vw,88px);background:var(--mist);border:1px solid var(--line);padding:clamp(20px,4vw,48px);display:grid;place-items:center}
.biz-diagram img{max-width:100%;height:auto;display:block}
.biz-pn{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-top:1px solid var(--line)}
.biz-pn a{padding:36px 0;display:grid;gap:6px;transition:color .2s}
.biz-pn a:last-child{text-align:right;border-left:1px solid var(--line);padding-left:24px}
.biz-pn a span{font-size:13px;color:var(--muted);font-family:var(--f-display);letter-spacing:.12em}
.biz-pn a b{font-size:20px;color:var(--ink)}
.biz-pn a:hover b{color:var(--violet)}
.family-btn[hidden]{display:none}
.family-btn{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 14px;border-radius:999px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.06);transition:background .25s,border-color .25s;white-space:nowrap;color:inherit}
.family-btn img{height:26px;width:auto;max-width:none;flex:none;display:block}
.family-btn .fl-c{display:none}
.hd.solid .family-btn{border-color:var(--line-2);background:var(--paper)}
.hd.solid .family-btn .fl-w{display:none}.hd.solid .family-btn .fl-c{display:block}
.family-btn:hover{background:var(--violet);border-color:var(--violet)}
.hd.solid .family-btn:hover{background:var(--lilac);border-color:var(--violet)}
.fm-family img{height:40px;width:auto;max-width:none;flex:none;display:block}
.tile .fam-logo{align-self:flex-start;height:auto;width:auto;max-width:min(240px,100%);max-height:64px;object-fit:contain;display:block;margin:12px 0 12px}
.fm-family{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--on-dark-line);padding:28px 0 40px;color:var(--on-dark-2)}
.fm-family a{color:#fff;font-weight:500;display:inline-flex;gap:8px;align-items:center}

.post-file{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line-2);padding:14px 20px;margin-top:28px;font-size:15px;color:var(--ink);background:var(--mist)}
.post-file:hover{border-color:var(--violet);color:var(--violet)}
@media (max-width:760px){.biz-intro{grid-template-columns:minmax(0,1fr)}.biz-pn a b{font-size:16px}.family-btn{padding:4px 8px 4px 10px}.family-btn img{height:20px}}
/* rich html content (site + editor) */
.rte-content{font-size:17px;line-height:1.9;color:#2F2D4E;overflow-wrap:break-word}
.rte-content>*:first-child{margin-top:0}
.rte-content p{margin:0 0 1em}
.rte-content h2{font-size:clamp(24px,2.4vw,32px);font-weight:700;color:var(--ink);margin:1.6em 0 .6em;line-height:1.35}
.rte-content h3{font-size:clamp(20px,1.8vw,24px);font-weight:700;color:var(--ink);margin:1.4em 0 .5em}
.rte-content h4{font-size:18px;font-weight:700;color:var(--ink);margin:1.2em 0 .4em}
.rte-content ul,.rte-content ol{margin:0 0 1em;padding-left:1.4em}
.rte-content li{margin:.25em 0}
.rte-content a{color:var(--violet);text-decoration:underline;text-underline-offset:3px}
.rte-content img{max-width:100%;height:auto;display:block;margin:1.2em 0}
.rte-content blockquote{margin:1.2em 0;padding:4px 0 4px 24px;border-left:3px solid var(--violet);font-size:1.15em;font-weight:500;color:var(--ink)}
.md-head{max-width:860px;margin-bottom:clamp(40px,5vw,64px)}
.md-head h2{font-size:clamp(30px,3.6vw,48px);color:var(--ink);margin:12px 0 14px;line-height:1.25}
.md-head p:not(.eyebrow){color:var(--muted);font-size:17px;line-height:1.8}
.md-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(16px,2vw,28px)}
.md-card{display:grid;gap:18px;align-content:start;color:inherit}
.md-card .th{aspect-ratio:4/3;background:linear-gradient(160deg,#F4F3FA,#E9E7F3);border:1px solid var(--line);display:grid;place-items:center;padding:12%;overflow:hidden;transition:border-color .3s var(--ease),box-shadow .3s var(--ease)}
.md-card .th img{width:100%;height:100%;object-fit:contain;transition:transform .5s var(--ease);mix-blend-mode:multiply}
.md-card .ph,.md-img .ph{font-family:var(--f-display);letter-spacing:.2em;color:#B9B4D3;font-size:14px}
.md-card:hover .th,.md-card:focus-visible .th{border-color:var(--violet);box-shadow:0 18px 40px -24px rgba(82,48,194,.45)}
.md-card:hover .th img{transform:scale(1.05)}
.md-card .b{text-align:center;display:grid;gap:6px}
.md-card .sr2{font-size:13px;color:var(--muted);letter-spacing:.02em}
.md-card h3{font-family:var(--f-display);font-size:clamp(16px,1.35vw,19px);font-weight:600;color:var(--ink);line-height:1.4}
.md-top{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(32px,5vw,80px);align-items:start}
.md-img{aspect-ratio:4/3;background:linear-gradient(160deg,#F4F3FA,#E9E7F3);border:1px solid var(--line);display:grid;place-items:center;padding:10%;position:sticky;top:150px}
.md-img img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}

.slide.dim-strong::after{background:linear-gradient(90deg,rgba(11,10,69,.88) 0%,rgba(11,10,69,.5) 55%,rgba(11,10,69,.15))}
.hero .hero-copy h1,.hero .hero-copy .sub{text-shadow:0 2px 24px rgba(0,0,0,.25)}
.hero-copy{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero-copy .wrap{width:100%}
.hero h1{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,6.4vw,92px);line-height:1.04;letter-spacing:-.035em;max-width:14ch;margin:22px 0 28px}
.hero h1 b{font-weight:700}
.hero .sub{font-size:clamp(16px,1.5vw,20px);color:var(--on-dark-2);max-width:40ch;white-space:pre-line}
.hero .ctas{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.slide.on .anim{animation:rise .9s var(--ease) both}
.slide.on .anim.d2{animation-delay:.12s}.slide.on .anim.d3{animation-delay:.24s}.slide.on .anim.d4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-ctrl{position:absolute;z-index:3;left:0;right:0;bottom:56px}
.hero-ctrl .wrap{display:flex;align-items:center;gap:20px}
.hero-ctrl .cur{font-family:var(--f-display);font-weight:600;font-size:14px}
.hero-ctrl .tot{font-family:var(--f-display);font-size:14px;opacity:.5}
.bar{width:min(240px,30vw);height:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--violet-soft);transform-origin:left;transform:scaleX(0)}
.bar i.run{animation:prog var(--dur,6s) linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center;transition:background .25s,border-color .25s}
.circ:hover{background:#fff;color:var(--ink)}
.scroll-cue{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-size:11px;letter-spacing:.3em;opacity:.7}
.scroll-cue i{display:block;width:56px;height:1px;background:rgba(255,255,255,.4);position:relative;overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;inset:0;background:#fff;animation:cue 2.2s var(--ease) infinite}
@keyframes cue{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- sections ---------- */
.sec{padding-block:clamp(88px,11vw,150px)}
.sec.mist{background:var(--mist)}
.dark{background:var(--ink);color:#fff}
.sec-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(40px,5vw,64px)}
.sec-hd h2{font-size:clamp(30px,3.6vw,48px);font-weight:700;margin-top:14px;line-height:1.25}
.sec-hd .lead{color:var(--muted);max-width:42ch}
.dark .sec-hd .lead{color:var(--on-dark-2)}
.more-link{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.2em}
.more-link i{display:block;width:36px;height:1px;background:currentColor;transition:width .3s var(--ease)}
.more-link:hover i{width:56px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-block:72px}
.stat{padding:0 28px;border-left:1px solid var(--on-dark-line)}
.stat .v{font-size:clamp(38px,4.4vw,60px);font-weight:600;line-height:1.1;letter-spacing:-.03em}
.stat .v em{font-style:normal;color:var(--violet-soft)}
.stat .l{color:var(--on-dark-2);font-size:14px;margin-top:10px}

/* business cards (accordion-like hover expand) */
.biz{display:flex;gap:16px;height:540px}
.biz-card{position:relative;flex:1;min-width:0;overflow:hidden;color:#fff;transition:flex .6s var(--ease)}
.biz-card .vis{position:absolute;inset:0}
.biz-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.05) 20%,rgba(11,10,69,.92));transition:background .5s}
.biz-card .in{position:absolute;z-index:2;left:28px;right:14px;bottom:36px}
.biz-card .no{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet-soft)}
.biz-card h3{font-family:var(--f-display);font-size:clamp(18px,1.45vw,26px);font-weight:600;margin:10px 0 8px;line-height:1.2}
.biz-card .ko{font-size:15px;color:var(--on-dark-2)}
.biz-card .desc{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .4s;font-size:14px;color:var(--on-dark-2);max-width:36ch}
.biz-card .line{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease);z-index:3}
.biz:hover .biz-card{flex:1}
.biz .biz-card:hover,.biz:not(:hover) .biz-card:first-child{flex:1.9}
.biz .biz-card:hover .desc,.biz:not(:hover) .biz-card:first-child .desc{max-height:120px;opacity:1;margin-top:14px}
.biz .biz-card:hover .line,.biz:not(:hover) .biz-card:first-child .line{transform:scaleX(1)}

/* product scroller */
.scroller-hd{display:flex;align-items:center;gap:14px}
.scroller-hd .cnt{font-family:var(--f-display);font-size:14px;color:var(--muted);min-width:56px;text-align:right}
.circ-dk{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.circ-dk:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:none;padding-left:max(24px,calc((100vw - var(--wrap)) / 2));padding-right:max(24px,var(--gut-r));scroll-padding-left:max(24px,calc((100vw - var(--wrap)) / 2))}
.track::-webkit-scrollbar{display:none}
.p-card{flex:0 0 clamp(280px,32vw,420px);scroll-snap-align:start;background:var(--paper);display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s}
.p-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -24px rgba(11,10,69,.35)}
.p-card .vis{aspect-ratio:4/3;max-width:100%}
.p-card .vis img{transition:transform .8s var(--ease)}
.p-card:hover .vis img{transform:scale(1.05)}
.p-card .b{padding:28px 30px 32px;display:flex;flex-direction:column;gap:10px;flex:1}
.p-card h3{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--ink)}
.p-card p{color:var(--muted);font-size:14px}
.p-card .go{margin-top:auto;padding-top:12px;font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:40px;background:var(--paper)}
.mq-row{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq-row span{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,8vw,112px);line-height:1;letter-spacing:-.03em;color:var(--ink);padding-right:.5em;white-space:nowrap}
.mq-row span.o{color:transparent;-webkit-text-stroke:1px rgba(11,10,69,.35)}
.mq-row span.d{color:var(--violet)}
@keyframes mq{to{transform:translateX(-50%)}}

/* news */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:9px 20px;font-size:14px;color:var(--muted);transition:all .25s}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.news-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:32px}
.n-card{display:flex;flex-direction:column;gap:18px}
.n-card .vis{aspect-ratio:3/2;max-width:100%}
.n-card .vis img{transition:transform .8s var(--ease)}
.n-card:hover .vis img{transform:scale(1.05)}
.n-card h3{font-size:19px;font-weight:500;line-height:1.5;transition:color .2s}
.n-card:hover h3{color:var(--violet)}
.meta{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;background:var(--lilac);color:var(--violet);letter-spacing:0;white-space:nowrap}
.badge.ink{background:var(--ink);color:#fff}
.badge.new{background:var(--violet);color:#fff;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}
.badge.off{background:var(--mist);color:var(--muted);border:1px solid var(--line)}
.n-list{border-top:2px solid var(--ink)}
.n-list .hd2{display:flex;justify-content:space-between;align-items:center;padding:0 0 16px;margin-top:-46px}
.n-list a.r{display:flex;align-items:center;gap:12px;padding:19px 0;border-bottom:1px solid var(--line);transition:padding .25s var(--ease)}
.n-list a.r:hover{padding-left:8px}
.n-list a.r .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-list a.r:hover .t{color:var(--violet)}

/* partners */
.logos{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.logos .row{display:flex;gap:20px;width:max-content;animation:mq 30s linear infinite}
.logo-chip{width:200px;height:88px;flex:none;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.06em;padding:16px}
.logo-chip img{max-height:44px;max-width:150px;object-fit:contain;filter:grayscale(1);opacity:.75;transition:all .3s}
.logo-chip:hover img{filter:none;opacity:1}

/* CTA */
.cta{position:relative;overflow:hidden}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;position:relative;z-index:2;padding-block:110px}
.cta h2{font-size:clamp(28px,3.2vw,42px);font-weight:700;margin:16px 0 12px;max-width:22ch}
.cta p{color:var(--on-dark-2)}
.cta .ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta::before{content:"";position:absolute;right:-8%;top:-30%;width:560px;max-width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(82,48,194,.55),transparent 65%)}

/* footer */
.ft{background:#07062F;color:var(--on-dark-2);font-size:14px}
.ft-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px 72px;padding-block:72px 56px;align-items:start}
.ft-logo{height:28px;width:auto;display:block;margin-bottom:28px}
.ft-name{color:#fff;font-size:15px;font-weight:500;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ft-name span{color:var(--on-dark-2);font-weight:400;padding-left:14px;border-left:1px solid var(--on-dark-line)}
.ft-info{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px 16px;margin:0;line-height:1.75}
.ft-info dt{color:rgba(255,255,255,.88);font-weight:500;white-space:nowrap}
.ft-info dd{margin:0;min-width:0}
.ft-info dd span{display:inline-block;margin-right:22px;white-space:nowrap}
.ft-info dd span b{font-weight:400;color:rgba(255,255,255,.5);margin-right:6px}
.ft-cols{display:flex;gap:48px;flex-wrap:wrap}
.ft-cols h4{color:#fff;font-size:14px;font-weight:500;margin-bottom:14px}
.ft-cols a{display:block;line-height:2.2;transition:color .2s}
.ft-cols a:hover{color:#fff}
.ft-fam{display:inline-flex!important;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--on-dark-line);line-height:1!important;transition:border-color .25s,background .25s}
.ft-fam img{height:30px;width:auto;max-width:none;flex:none;display:block}
.ft-fam:hover{border-color:var(--violet-soft);background:rgba(255,255,255,.04)}
.ft-fam svg{color:rgba(255,255,255,.7);flex:none}
@media (max-width:1080px){.ft-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.ft-info{grid-template-columns:minmax(0,1fr);gap:2px}.ft-info dd{margin-bottom:10px}.ft-cols{gap:32px}}
.ft .bot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--on-dark-line);padding-block:24px 32px;font-size:13px}
.ft .bot a{margin-left:20px}
.ft .bot a:first-child{margin-left:0;color:#fff}

/* sub pages */
.sub-vis{position:relative;height:440px;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.sub-vis .vis{position:absolute;inset:0}
.sub-vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.55),rgba(11,10,69,.85))}
.hero-vis img.hv-img,.hero-vis video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
.hero-vis video{opacity:0;transition:opacity .8s ease}
.hero-vis video.on{opacity:1}
.sub-vis.has-img .vis img{object-position:right center}
.sub-vis.has-img::after{background:linear-gradient(90deg,rgba(7,10,38,.92) 0%,rgba(7,10,38,.7) 38%,rgba(7,10,38,.25) 75%,rgba(7,10,38,.1) 100%),linear-gradient(0deg,rgba(7,10,38,.55),transparent 45%)}
@media (max-width:760px){.sub-vis.has-img .vis img{object-position:78% center}.sub-vis.has-img::after{background:linear-gradient(90deg,rgba(7,10,38,.9),rgba(7,10,38,.5)),linear-gradient(0deg,rgba(7,10,38,.6),transparent 50%)}}
.sub-vis .wrap{position:relative;z-index:2;width:100%;padding-bottom:64px}
.sub-vis h1{font-size:clamp(34px,4.6vw,60px);font-weight:700;margin:14px 0 12px}
.crumb{font-size:13px;color:var(--on-dark-2);font-family:var(--f-display);letter-spacing:.04em}
.lnb{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:20}
.lnb .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.lnb a,.lnb button{padding:22px 26px;font-size:15px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.lnb .on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}

.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px);align-items:start}
.about-grid .vis{aspect-ratio:4/5;max-width:100%}
.ceo-msg{font-size:17px;color:#38365A;white-space:pre-line;line-height:2}
.ceo-sign{margin-top:44px;font-size:15px;color:var(--muted);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.ceo-sign .sig{font-family:"Nanum Brush Script","Nanum Pen Script",cursive;font-size:clamp(46px,4.6vw,60px);line-height:1;color:var(--ink);letter-spacing:.02em;transform:rotate(-4deg);display:inline-block;padding:0 6px 4px;position:relative}
.ceo-sign .sig::after{content:"";position:absolute;left:-4px;right:-10px;bottom:2px;height:2px;background:linear-gradient(90deg,transparent,var(--violet) 18%,var(--violet) 70%,transparent);opacity:.55;transform:rotate(2deg)}
.ceo-sign img.sig-img{height:64px;width:auto;max-width:240px;object-fit:contain;display:block}
.timeline{display:grid;gap:0;border-top:1px solid var(--line)}
.htl-sec{background:#0C0A2A;color:#fff;position:relative;overflow:hidden}
.htl-sec::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 0%,rgba(110,76,232,.28),transparent 70%);pointer-events:none}
.htl-sec .wrap{position:relative}
.htl-hd{text-align:center;max-width:720px;margin:0 auto clamp(56px,7vw,96px)}
.htl-hd h2{color:#fff;font-size:clamp(34px,4vw,56px);margin:12px 0 0}
.htl-hd .lead{color:rgba(255,255,255,.72);margin-top:18px}
.htl-hd .eyebrow{color:#A996FF}
.htl-span{display:inline-flex;align-items:center;gap:14px;margin-top:26px;font-family:var(--f-display);font-size:15px;color:rgba(255,255,255,.6);letter-spacing:.08em}
.htl-span i{width:72px;height:1px;background:linear-gradient(90deg,rgba(255,255,255,.2),#8F72FF)}
.htl{--htl-p:0%;position:relative;padding:24px 0 8px}
.htl-line{position:absolute;left:50%;top:0;bottom:0;width:1px;transform:translateX(-50%);background:linear-gradient(180deg,rgba(255,255,255,.18) 96%,rgba(255,255,255,0))}
.htl-prog{position:absolute;left:0;top:0;width:100%;height:var(--htl-p);background:linear-gradient(180deg,#5B3FD6,#9C86F0);box-shadow:0 0 12px rgba(156,134,240,.8);transition:height .25s linear}
.htl-prog::after{content:"";position:absolute;left:50%;bottom:-4px;width:9px;height:9px;border-radius:50%;background:#fff;transform:translateX(-50%);box-shadow:0 0 0 4px rgba(156,134,240,.35),0 0 18px #9C86F0}
.htl-cap{position:absolute;left:50%;top:-6px;width:12px;height:12px;border:1px solid #9C86F0;transform:translateX(-50%) rotate(45deg);background:#0C0A2A}
.htl-item{display:flex;padding:0 0 clamp(48px,6vw,80px)}
.htl-item.l{justify-content:flex-end}
.htl-item.r{justify-content:flex-start}
.htl-body{width:calc(50% - clamp(32px,4vw,56px));opacity:.38;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.htl-item.l .htl-body{order:2}
.htl-item.r .htl-body{text-align:right}
.htl-item.on .htl-body{opacity:1;transform:none}
.htl-y{position:relative;margin:0;font-family:var(--f-display);font-size:clamp(32px,3.4vw,46px);font-weight:700;line-height:1.1;color:rgba(255,255,255,.55);letter-spacing:-.01em;transition:color .5s}
.htl-item.on .htl-y{color:#fff}
.htl-item.cur .htl-y{color:#B9A8FF}
.htl-dot{position:absolute;top:50%;width:11px;height:11px;margin-top:-5.5px;border-radius:50%;background:#3A3366;border:1px solid rgba(255,255,255,.35);transition:background .4s,border-color .4s}
.htl-item.l .htl-dot{left:calc(-1 * clamp(32px,4vw,56px) - 5.5px)}
.htl-item.r .htl-dot{right:calc(-1 * clamp(32px,4vw,56px) - 5.5px)}
.htl-item.on .htl-dot{background:#8F72FF;border-color:#8F72FF}
.htl-item.cur .htl-dot::after{content:"";position:absolute;inset:-1px;border-radius:50%;background:#8F72FF;animation:htlPulse 1.6s ease-out infinite}
@keyframes htlPulse{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(5)}}
.htl-body ul{list-style:none;margin:18px 0 0;padding:0;display:grid;gap:10px}
.htl-body li{position:relative;font-size:16px;line-height:1.65;color:rgba(255,255,255,.78);padding-left:16px}
.htl-body li::before{content:"";position:absolute;left:0;top:.78em;width:5px;height:1px;background:#9C86F0}
.htl-item.r .htl-body li{padding:0 16px 0 0}
.htl-item.r .htl-body li::before{left:auto;right:0}
@media (max-width:760px){
  .htl{padding-left:28px}
  .htl-line,.htl-cap{left:5px}
  .htl-item.l,.htl-item.r{justify-content:flex-start}
  .htl-body,.htl-item.r .htl-body{width:100%;text-align:left}
  .htl-item.l .htl-dot,.htl-item.r .htl-dot{left:-28px;right:auto}
  .htl-item.r .htl-body li{padding:0 0 0 16px}.htl-item.r .htl-body li::before{left:0;right:auto}
  .htl-body li{font-size:15px}
}
@media (prefers-reduced-motion:reduce){.htl-body{transform:none;transition:none}.htl-prog{transition:none}.htl-item.cur .htl-dot::after{animation:none}}
.tl-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
.tl-row .y{font-family:var(--f-display);font-size:32px;font-weight:600;color:var(--ink);line-height:1.1}
.tl-row .t{white-space:pre-line;color:#38365A}
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.loc dl{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px 20px}
.loc dt{color:var(--muted);font-size:14px}.loc dd{margin:0}
.loc{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);border:1px solid var(--line);background:var(--paper)}
.loc-map{min-width:0}
.loc .map-box{aspect-ratio:16/10;border:0;border-right:1px solid var(--line);height:100%;min-height:320px;display:block}
.loc .map-box.sketch{position:relative;color:inherit;--ls-bg:#F3F2F9;--ls-grid:#E4E2EF;--ls-road:#FFFFFF}
.loc-sketch{display:block;width:100%;height:100%}
.loc .map-box.map-img{position:relative;overflow:hidden;color:inherit}

  if (videoId) return `<div class="vis"><video src="${imgUrl(videoId)}" autoplay muted loop playsinline ${imageId?`poster="${imgUrl(imageId)}"`:""}></video></div>`;
  const ang = [135,160,120,150,110,170][i%6], px=[80,20,70,30,90,50][i%6], py=[10,20,80,90,40,0][i%6];
  return `<div class="vis">${imageId ? `<img src="${imgUrl(imageId)}" alt="${esc(alt)}" loading="lazy">` : `<div class="ph" style="--pa:${ang}deg;--px:${px}%;--py:${py}%"></div>`}</div>`;
}
function toast(msg, err){
  if (!inAdmin()) msg = trText(msg);
  const r = $("#toastRoot"); r.innerHTML = `<div class="toast${err?" err":""}" role="status">${esc(msg)}</div>`;
  clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2600);
}
function dbErr(e){
  const c = e && e.code;
  if (c === "invalid_argument") return "저장 권한이 없거나 입력값이 올바르지 않습니다.";
  if (c === "quota_exceeded") return "저장 공간이 가득 찼습니다. 오래된 항목을 삭제한 뒤 다시 시도하세요.";
  if (c === "resource_exhausted") return "요청이 많습니다. 잠시 후 다시 시도하세요.";
  return "저장하지 못했습니다. 잠시 후 다시 시도하세요.";
}

/* ---- history timeline: scroll progress line + active years ---- */
let htlRaf = 0;
function htlUpdate(){
  htlRaf = 0;
  const el = document.getElementById("htl"); if (!el) return;
  const r = el.getBoundingClientRect(), probe = innerHeight * 0.58;
  const per = Math.max(0, Math.min(1, (probe - r.top) / r.height));
  el.style.setProperty("--htl-p", (per*100).toFixed(2) + "%");
  let last = null;
  el.querySelectorAll(".htl-item").forEach(it => { const on = it.getBoundingClientRect().top < probe; it.classList.toggle("on", on); if (on) last = it; });
  el.querySelectorAll(".htl-item").forEach(it => it.classList.toggle("cur", it === last));
}
const htlQueue = () => { if (!htlRaf) htlRaf = requestAnimationFrame(() => { htlUpdate(); spyAbout(); }); };
window.addEventListener("scroll", htlQueue, {passive:true});
window.addEventListener("resize", htlQueue, {passive:true});

const TR_ATTR = /\b(placeholder|aria-label|title|alt)="([^"]*[\uAC00-\uD7A3][^"]*)"/g;
function trText(t){
  const k = t.trim(); if (!k || !/[\uAC00-\uD7A3]/.test(k)) return t;
  let v = DICT[k] ?? DICT[k.replace(/&amp;/g,"&")];
  if (v === undefined && k.includes(" › ")) { const parts = k.split(" › ").map(x => DICT[x.trim()] ?? x); if (parts.some((x,i) => x !== k.split(" › ")[i])) v = parts.join(" › "); }
  if (v === undefined){ let m;
    if ((m = k.match(/^전체 (\d+)건$/))) v = `${m[1]} posts`;
    else if ((m = k.match(/^대표이사 (.+)$/))) v = `CEO ${m[1]}`;
    else if ((m = k.match(/^(.+) 대표이사$/))) v = `${m[1]} CEO`;
    else if ((m = k.match(/^(.+) 구성도$/))) v = `${m[1]} diagram`;
    else if ((m = k.match(/^(.+) 사이트 바로가기 \(새 창\)$/))) v = `Visit ${m[1]} (new window)`;
  }
  return v === undefined ? t : t.replace(k, String(v).replace(/&(?!amp;|lt;|gt;|quot;|#)/g, "&amp;"));
}
function trHtml(html){
  if (ui.lang !== "en") return html;
  return html.replace(/>([^<>]+)</g, (m, t) => ">" + trText(t) + "<").replace(TR_ATTR, (m, a, v) => `${a}="${esc(trText(v)).replace(/&amp;/g,"&")}"`);
}

/* ---- safe HTML ---- */
const OK_TAGS = new Set("p br b strong i em u s h2 h3 h4 ul ol li a img table thead tbody tr th td blockquote span div section hr figure figcaption small sup sub".split(" "));
const DROP_TAGS = new Set("script style iframe object embed link meta form input button textarea select noscript template svg math".split(" "));
const OK_STYLE = /^(color|background-color|text-align|font-weight|font-style|text-decoration|text-decoration-line)$/;
function sanitize(html){
  const doc = new DOMParser().parseFromString(`<div>${html||""}</div>`, "text/html");
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 8) { ch.remove(); return; }
      if (ch.nodeType !== 1) return;
      const tag = ch.tagName.toLowerCase();
      if (DROP_TAGS.has(tag)) { ch.remove(); return; }
      if (!OK_TAGS.has(tag)) { const f = doc.createDocumentFragment(); while (ch.firstChild) f.appendChild(ch.firstChild); walk(f); ch.replaceWith(f); return; }
      [...ch.attributes].forEach(a => {
        const n = a.name.toLowerCase(), v = a.value.trim();
        let keep = false;
        if (n==="href") keep = /^(https?:|mailto:|tel:|#|\/)/i.test(v);
        else if (n==="src") keep = tag==="img" && (/^(\/_blob\/|\/?uploads\/|blob:)/.test(v) || /^data:image\/(png|jpe?g|gif|webp);/i.test(v));
        else if (["alt","title","colspan","rowspan","target"].includes(n)) keep = true;
        else if (n==="class") keep = /^[\w\s-]*$/.test(v);
        else if (n==="style"){ const clean = v.split(";").map(x=>x.trim()).filter(x => { const [k,val=""] = x.split(":"); return k && OK_STYLE.test(k.trim().toLowerCase()) && !/url\(|expression|javascript/i.test(val); }).join("; "); if (clean){ ch.setAttribute("style", clean); } else ch.removeAttribute("style"); return; }
        if (!keep) ch.removeAttribute(a.name);
      });
      if (tag==="a"){ if (/^https?:/i.test(ch.getAttribute("href")||"")) { ch.setAttribute("target","_blank"); ch.setAttribute("rel","noopener"); } else ch.removeAttribute("target"); }
      walk(ch);
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}

const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = sanitize(h); return d.textContent || ""; };

function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function renderRich(src){
  const secs = []; let sec = null, card = null;
  const newSec = (eb,title) => { sec = {eb,title,paras:[],quotes:[],list:[],cards:[],rows:[],after:[]}; secs.push(sec); card = null; };
  String(src||"").split("\n").forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l.startsWith("## ")){ const [a,...b] = l.slice(3).split("|"); newSec(b.length?a.trim():"", (b.length?b.join("|"):a).trim()); return; }
    if (!sec) newSec("","");
    if (l.startsWith("### ")){ card = {title:l.slice(4).trim(), list:[], paras:[]}; sec.cards.push(card); return; }
    if (l.startsWith("|")){ card = null; sec.rows.push(l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); return; }
    if (l.startsWith("> ")){ sec.quotes.push(l.slice(2)); return; }
    if (l.startsWith("- ")){ (card ? card.list : sec.list).push(l.slice(2)); return; }
    (card ? card.paras : sec.rows.length ? sec.after : sec.paras).push(l);
  });
  return `<div class="rich">${secs.map(x => {
    const E = x.eb.toUpperCase();
    const kind = /PROCESS|STEP/.test(E) ? "rs-steps" : /FEATURE|특장/.test(E) ? "rs-feat" : /CASE|TARGET|분야/.test(E) ? "rs-case" : "";
    const chipsOnly = kind!=="rs-feat" && x.cards.length && x.cards.every(c => !c.list.length && !c.paras.length);
    const [head, ...body] = x.rows;
    return `<section class="reveal ${kind}">
      ${x.title||x.eb?`<div class="rs-hd">${x.eb?`<p class="eyebrow">${esc(x.eb)}</p>`:""}${x.title?`<h3>${inl(x.title)}</h3>`:""}</div>`:""}
      ${x.quotes.map(q => `<p class="rs-quote">${inl(q)}</p>`).join("")}
      ${x.paras.map(q => `<p class="rs-p">${inl(q)}</p>`).join("")}
      ${x.list.length?`<ul class="rs-list" style="margin-bottom:24px">${x.list.map(i=>`<li>${inl(i)}</li>`).join("")}</ul>`:""}
      ${chipsOnly ? `<div class="rs-chips">${x.cards.map(c=>`<span class="rs-chip">${inl(c.title)}</span>`).join("")}</div>`
        : x.cards.length ? `<div class="rs-cards">${x.cards.map((c,i) => `<div class="rs-card">${kind==="rs-steps"?`<span class="n">STEP ${String(i+1).padStart(2,"0")}</span>`:kind==="rs-feat"?`<span class="n">${String(i+1).padStart(2,"0")}</span>`:""}<h4>${inl(c.title)}</h4>${c.paras.map(q=>`<p>${inl(q)}</p>`).join("")}${c.list.length?`<ul>${c.list.map(i=>`<li>${inl(i)}</li>`).join("")}</ul>`:""}</div>`).join("")}</div>` : ""}
      ${head?`<div class="rs-table"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td class="${/^[●○X✕-]$/.test(c)?"c":""}">${c==="●"?'<span class="dot">●</span>':inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
      ${x.after.map(q => `<p class="note" style="margin-top:16px">${inl(q)}</p>`).join("")}
    </section>`; }).join("")}</div>`;
}

const PRIVACY_KO = "<p>‘트리즈엔’(이하 ‘회사’)은 고객님의 개인정보를 중요시하며, 「정보통신망 이용촉진 및 정보보호 등에 관한 법률」을 준수하고 있습니다. 회사는 개인정보처리방침을 통하여 고객님께서 제공하시는 개인정보가 어떠한 용도와 방식으로 이용되고 있으며, 개인정보보호를 위해 어떠한 조치가 취해지고 있는지 알려드립니다.</p>\n<p>회사는 개인정보처리방침을 개정하는 경우 웹사이트 공지사항(또는 개별공지)을 통하여 공지합니다.</p>\n<blockquote>본 방침은 2025년 7월 24일부터 시행됩니다.</blockquote>\n<h3>1. 수집하는 개인정보 항목</h3>\n<p>회사는 상담, 서비스 신청 등을 위해 아래와 같은 개인정보를 수집하고 있습니다.</p>\n<ul><li><strong>수집항목</strong> : 이름, 이메일, 연락처, 문의항목, 제목, 내용, 쿠키</li><li><strong>개인정보 수집방법</strong> : 홈페이지(고객문의)</li></ul>\n<h3>2. 개인정보의 수집 및 이용목적</h3>\n<p>회사는 수집한 개인정보를 다음의 목적을 위해 활용합니다.</p>\n<ul><li><strong>온라인 문의</strong> : 문의내역 접수 및 답변 처리</li></ul>\n<h3>3. 개인정보의 보유 및 이용기간</h3>\n<p>원칙적으로, 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 단, 관계법령의 규정에 의하여 보존할 필요가 있는 경우 회사는 아래와 같이 관계법령에서 정한 일정한 기간 동안 이용자정보를 보관합니다.</p>\n<ul><li>보존 항목 : 성함, 연락처, 이메일</li><li>보존 근거 : 온라인 문의 피드백을 위한 기본 자료</li><li>보존 기간 : 온라인 문의 피드백 종료 시까지</li></ul>\n<h3>4. 개인정보의 파기절차 및 방법</h3>\n<p>회사는 원칙적으로 개인정보 수집 및 이용목적이 달성된 후에는 해당 정보를 지체 없이 파기합니다. 파기절차 및 방법은 다음과 같습니다.</p>\n<h4>파기절차</h4>\n<p>이용자님이 문의사항 접수 등을 위해 입력하신 정보는 목적이 달성된 후 별도의 DB로 옮겨져(종이의 경우 별도의 서류함) 내부 방침 및 기타 관련 법령에 의한 정보보호 사유에 따라(보유 및 이용기간 참조) 일정 기간 저장된 후 파기됩니다. 별도 DB로 옮겨진 개인정보는 법률에 의한 경우가 아니고서는 보유되는 이외의 다른 목적으로 이용되지 않습니다.</p>\n<h4>파기방법</h4>\n<ul><li>전자적 파일형태로 저장된 개인정보는 기록을 재생할 수 없는 기술적 방법을 사용하여 삭제합니다.</li></ul>\n<h3>5. 개인정보 제공</h3>\n<p>회사는 이용자의 개인정보를 원칙적으로 외부에 제공하지 않습니다. 다만, 아래의 경우에는 예외로 합니다.</p>\n<ul><li>이용자들이 사전에 동의한 경우</li><li>법령의 규정에 의거하거나, 수사 목적으로 법령에 정해진 절차와 방법에 따라 수사기관의 요구가 있는 경우</li></ul>\n<h3>6. 수집한 개인정보의 위탁</h3>\n<p>회사는 서비스 이행을 위해 아래와 같이 외부 전문업체에 위탁하여 운영하고 있습니다.</p>\n<table><tbody><tr><th>위탁 대상자</th><td>주식회사 쓰리웨이</td></tr><tr><th>위탁업무 내용</th><td>웹사이트 및 시스템 관리</td></tr></tbody></table>\n<h3>7. 정보주체와 법정대리인의 권리·의무 및 행사방법</h3>\n<p>정보주체는 회사에 대해 언제든지 다음 각 호의 개인정보 보호 관련 권리를 행사할 수 있습니다. (고객서비스담당 부서 : 고객지원부)</p>\n<ol><li>개인정보 열람요구</li><li>오류 등이 있을 경우 정정 요구</li><li>삭제요구</li><li>처리정지 요구</li></ol>\n<p>※ 만 14세 미만 아동의 경우, 법정대리인이 아동의 개인정보를 조회하거나 수정할 권리, 수집 및 이용 동의를 철회할 권리를 가집니다.</p>\n<h3>8. 개인정보 자동수집 장치의 설치, 운영, 거부</h3>\n<p>회사는 귀하의 정보를 수시로 저장하고 찾아내는 ‘쿠키(cookie)’ 등을 운용합니다. 쿠키란 회사의 웹사이트를 운영하는데 이용되는 서버가 귀하의 브라우저에 보내는 아주 작은 텍스트 파일로서 귀하의 컴퓨터 하드디스크에 저장됩니다.</p>\n<h4>쿠키란 무엇일까요?</h4>\n<p>쿠키란 웹사이트를 운영하는데 이용되는 서버가 이용자의 브라우저에 보내는 아주 작은 텍스트 파일로서 이용자의 컴퓨터에 저장됩니다.</p>\n<h4>쿠키 등 사용 목적</h4>\n<p>쿠키를 통해 이용자가 선호하는 설정 등을 저장하여 이용자에게 보다 빠른 웹 환경을 지원하며, 편리한 이용을 위해 서비스 개선에 활용합니다. 이를 통해 이용자는 보다 손쉽게 서비스를 이용할 수 있게 됩니다.</p>\n<h4>쿠키를 수집하지 못하게 거부하고 싶다면?</h4>\n<p>이용자는 쿠키 설치에 대한 선택권을 가지고 있습니다. 따라서 이용자는 웹 브라우저에서 옵션을 설정함으로써 모든 쿠키를 허용하거나, 쿠키가 저장될 때마다 확인을 거치거나, 모든 쿠키의 저장을 거부할 수도 있습니다. 다만 쿠키 설치를 거부할 경우 웹 사용이 불편해지며 로그인이 필요한 일부 서비스 이용에 어려움이 있을 수 있습니다.</p>\n<h4>설정 방법의 예</h4>\n<ol><li>Internet Explorer의 경우 : 웹 브라우저 상단의 도구 메뉴 &gt; 인터넷 옵션 &gt; 개인정보 &gt; 설정</li><li>Chrome의 경우 : 웹 브라우저 우측의 설정 메뉴 &gt; 화면 하단의 고급 설정 표시 &gt; 개인정보의 콘텐츠 설정 버튼 &gt; 쿠키</li></ol>\n<h3>9. 개인정보에 관한 민원서비스</h3>\n<p>회사는 고객의 개인정보를 보호하고 개인정보와 관련한 불만을 처리하기 위하여 아래와 같이 관련 부서 및 개인정보관리책임자를 지정하고 있습니다.</p>\n<table><tbody><tr><th>고객서비스담당 부서</th><td>고객지원부 · 031-247-5966</td></tr><tr><th>개인정보관리책임자</th><td>백성우 · 031-247-5966</td></tr></tbody></table>\n<p>귀하께서는 회사의 서비스를 이용하시며 발생하는 모든 개인정보보호 관련 민원을 개인정보관리책임자 혹은 담당부서로 신고하실 수 있습니다. 회사는 이용자들의 신고사항에 대해 신속하게 충분한 답변을 드릴 것입니다.</p>\n<p>기타 개인정보침해에 대한 신고나 상담이 필요하신 경우에는 아래 기관에 문의하시기 바랍니다.</p>\n<ol><li>개인정보침해신고센터 (privacy.kisa.or.kr / 국번없이 118)</li><li>대검찰청 사이버수사과 (www.spo.go.kr / 국번없이 1301)</li><li>경찰청 사이버수사국 (police.go.kr / 국번없이 182)</li></ol>";

let heroTimer = 0;
function startHero(){
  clearTimeout(heroTimer);
  const wide = matchMedia("(min-width: 761px)").matches, still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  document.querySelectorAll(".hero-vis video[data-src]").forEach(v => {
    if (!wide || still) return; // phones & reduced motion keep the still image (no video download)
    v.addEventListener("playing", () => v.classList.add("on"), {once:true});
    v.src = v.dataset.src; v.removeAttribute("data-src"); v.autoplay = true; v.play().catch(() => {});
  });
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll(".slide video, .film video").forEach(v => { v.removeAttribute("autoplay"); v.pause(); });
  if (ui.heroPaused) return;
  const bar = $("#heroBar"); if (!bar) return; // single slide: no slider controls
  const n = document.querySelectorAll(".slide").length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  bar.classList.remove("run"); void bar.offsetWidth;
  if (n < 2 || reduce) { bar.style.transform = "scaleX(1)"; return; }
  bar.classList.add("run");
  heroTimer = setTimeout(() => goSlide(ui.slide+1), 6000);
}
function goSlide(i){
  const slides = document.querySelectorAll(".slide"); const n = slides.length; if (!n) return;
  ui.slide = (i+n)%n;
  slides.forEach((s,k) => { s.classList.toggle("on", k===ui.slide); s.setAttribute("aria-hidden", k!==ui.slide); });
  const c = $(".hero-ctrl .cur"); if (c) c.textContent = String(ui.slide+1).padStart(2,"0");
  startHero();
}
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; const el = e.target; io.unobserve(el);
    el.classList.add("in");
    el.querySelectorAll("[data-count]").forEach(countUp);
  }), {threshold:.2});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}
function countUp(el){
  const to = parseFloat(el.dataset.count); if (isNaN(to) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const comma = el.dataset.fmt==="comma"; const t0 = performance.now(), dur = 1600;
  const f = t => { const p = Math.min(1,(t-t0)/dur), v = Math.round(to*(1-Math.pow(1-p,3)));
    el.textContent = comma ? v.toLocaleString("en-US") : v; if (p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}

function wireTrack(){
  const tr = $("#pTrack"), cnt = $("#pCnt"); if (!tr || !cnt) return;
  const n = tr.children.length;
  tr.addEventListener("scroll", () => { const w = (tr.querySelector(".p-card")?.offsetWidth||400)+24; cnt.textContent = String(Math.min(n, Math.round(tr.scrollLeft/w)+1)).padStart(2,"0")+" / "+String(n).padStart(2,"0"); }, {passive:true});
  let down=false, sx=0, sl=0, moved=false;
  tr.addEventListener("pointerdown", e => { if (e.pointerType!=="mouse") return; down=true; moved=false; sx=e.clientX; sl=tr.scrollLeft; tr.style.scrollSnapType="none"; });
  window.addEventListener("pointermove", e => { if(!down) return; const d=e.clientX-sx; if(Math.abs(d)>4) moved=true; tr.scrollLeft = sl-d; });
  window.addEventListener("pointerup", () => { if(!down) return; down=false; tr.style.scrollSnapType=""; });
  tr.addEventListener("click", e => { if (moved){ e.preventDefault(); moved=false; } }, true);
}

const myDrafts = () => S.drafts.filter(d => canSec(d.col));

function setPreview(on){ ui.preview = on; store.set("tz-preview", on ? "1" : "0", sessionStorage); ui.popDone = true; render(false); }
async function publishNow(c, docId, data){
  await publishDraft({id:`${c}__${docId}`, col:c, docId, data});
  toast("바로 반영했습니다. 방문자에게도 보입니다.");
}
async function publishDraft(d){
  const [c, id] = [d.col, d.docId];
  const live = c==="site" ? (S.config && Object.keys(S.config).length ? S.config : null) : S[c].find(x => x.id === id);
  const base = live ? Object.fromEntries(Object.entries(live).filter(([k]) => k !== "id")) : {};
  const data = {...base, ...d.data, updatedAt:new Date().toISOString()};
  await db.doc(c==="site" ? "site/config" : `${c}/${id}`).set(data);
  await db.doc("drafts/" + d.id).delete();
}
async function publishMany(list){
  let ok = 0;
  for (const d of list){ try { await publishDraft(d); ok++; } catch(err){ toast(dbErr(err), true); break; } }
  if (ok) toast(ok === 1 ? "반영했습니다. 방문자에게도 보입니다." : `${ok}건을 반영했습니다. 방문자에게도 보입니다.`);
}
async function dropDraft(d){ try { await db.doc("drafts/" + d.id).delete(); toast("반영 대기 중인 변경을 취소했습니다."); } catch(err){ toast(dbErr(err), true); } }
function draftLink(d){ if (d.col==="site") return "#home"; const f = SITE_LINK[d.col]; return f ? f({id:d.docId, ...d.data}) : "#home"; }
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("[data-pvon]")){ setPreview(true); return; }
  if (t.closest("[data-pvoff]")){ ui.pvOpen = false; setPreview(false); return; }
  if (t.closest("[data-pvlist]")){ ui.pvOpen = !ui.pvOpen; renderPreviewBar(); return; }
  if (t.closest("[data-pvall]")){ ui.pvOpen = false; await publishMany(myDrafts()); return; }
  const go = t.closest("[data-pvgo]"); if (go){ const d = S.drafts.find(x => x.id===go.dataset.pvgo); if (d){ ui.pvOpen = false; if (!ui.preview) { ui.preview = true; store.set("tz-preview","1",sessionStorage); } location.hash = draftLink(d); render(true); } return; }
  const pub = t.closest("[data-pvpub]"); if (pub){ const d = S.drafts.find(x => x.id===pub.dataset.pvpub); if (d) await publishMany([d]); return; }
  const drop = t.closest("[data-pvdrop]"); if (drop){ const d = S.drafts.find(x => x.id===drop.dataset.pvdrop); if (d) await dropDraft(d); return; }
});

  msg.textContent = "압축 중입니다. 끝날 때까지 이 탭을 열어 두세요.";
  try {
    const out = await compressVideo(f, plan, p => { bar.firstElementChild.style.width = (p*100).toFixed(1)+"%"; });
    if (out.size > MAX_UP()) throw new Error(`압축 결과가 ${(out.size/1048576).toFixed(1)}MB라 ${MAX_LABEL()}를 넘었습니다. 길이를 줄이거나 해상도를 낮춰 다시 시도하세요.`);
    msg.textContent = `압축 완료 (${(out.size/1048576).toFixed(1)}MB). 업로드 중…`;
    const r = await assets.upload(out); recordMedia(r.id, out, "video");
    box.querySelector(`[data-imgval="${key}"]`).value = r.id;
    box.querySelector(".prev").innerHTML = `<video src="${r.url}" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
    box.querySelector(".help").textContent = "업로드 완료 · 저장하면 반영됩니다.";
    vz.remove(); vzFiles.delete(key); toast("영상을 압축해서 올렸습니다. 저장하면 반영됩니다.");
  } catch(err){
    msg.innerHTML = `<span class="warn">${esc(err.message || "압축하지 못했습니다.")}</span>`;
    vz.querySelectorAll("select,button").forEach(x => x.disabled = false);
  }
});
document.addEventListener("click", e => { const cl = e.target.closest("[data-imgclear]"); if (!cl) return; const box = cl.closest(".img-field"); box.querySelector(`[data-imgval="${cl.dataset.imgclear}"]`).value = ""; box.querySelector(".prev").innerHTML = '<div class="ph"></div>'; cl.remove(); });

/* ================= boot ================= */
render(true);
(async () => {
  const C = window.claude; if (!C || !C.use){ S.timedOut = true; render(false); return; }
  const timer = setTimeout(() => { if (!S.loaded){ S.timedOut = true; schedule(); } }, 10000);
  try { user = await C.use("user"); } catch {}
  try { db = await C.use("db"); } catch {}
  if (user){ try { canEdit = await user.canEdit(); } catch {} try { myId = await user.id(); } catch {} }
  if (SRV && user?.me){ try { me = await user.me(); perms = me ? (me.perms || []) : []; } catch {} }
  if (canEdit){ try { assets = await C.use("assets"); } catch {} }
  if (!db){ clearTimeout(timer); S.timedOut = true; schedule(); return; }
  let pending = COLS.length + 1;
  const done = (snap) => { if (snap && snap.metadata && !snap.metadata.fromCache && !S.loaded && --pending <= 0){ S.loaded = true; clearTimeout(timer); } };
  const fail = () => { S.timedOut = true; clearTimeout(timer); schedule(); };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); done(snap); schedule(); }, fail));
  db.doc("site/config").onSnapshot(snap => { S.config = snap.exists ? snap.data() : {}; done(snap); schedule(); }, fail);
  if (canEdit) db.collection("drafts").onSnapshot(snap => { S.drafts = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, () => {});
  if (canEdit && canSec("inquiries")) db.collection("inquiries").onSnapshot(snap => { S.inquiries = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, () => {});
})();
})();
</script>
