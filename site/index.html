<title>트리즈엔 홈페이지</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
<style>
/* Layout: full-bleed dark ink bands alternate with white/mist bands; 1280px content column; admin = fixed sidebar + work area.
   Single deliberate light look (brand site), colors set explicitly. */
:root{
  color-scheme: light;
  --ink:#0B0A45;        /* logo navy */
  --ink-2:#15135C;
  --ink-3:#221F78;
  --violet:#5230C2;     /* logo violet */
  --violet-soft:#9C86F0;
  --lilac:#EFEBFC;
  --paper:#FFFFFF;
  --mist:#F6F5FB;
  --line:#E5E3F0;
  --line-2:#D3D0E3;
  --text:#17162E;
  --muted:#6C6A86;
  --on-dark:#FFFFFF;
  --on-dark-2:rgba(255,255,255,.66);
  --on-dark-line:rgba(255,255,255,.14);
  --ok:#1E8A5A; --danger:#C93B3B; --warn:#B7791F;
  --f-display:"Sora","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --wrap:1280px;
  --gut:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.7;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;word-break:keep-all}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px}
h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.025em}
p{margin:0}
.wrap{max-width:calc(var(--wrap) + 96px);margin:0 auto;padding-left:max(24px,var(--gut));padding-right:max(24px,var(--gut-r))}
.eyebrow{font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--violet)}
.dark .eyebrow{color:var(--violet-soft)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border:1px solid transparent;font-size:15px;font-weight:500;transition:background .25s var(--ease),color .25s,border-color .25s,transform .25s var(--ease);white-space:nowrap}
.btn svg{transition:transform .25s var(--ease)}
.btn:hover svg{transform:translateX(4px)}
.btn-violet{background:var(--violet);color:#fff}
.btn-violet:hover{background:var(--ink-3)}
.btn-ink{background:var(--ink);color:#fff}
.btn-ink:hover{background:var(--violet)}
.btn-line{border-color:var(--line-2);background:var(--paper);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}
.btn-ghost{border-color:rgba(255,255,255,.4);color:#fff}
.btn-ghost:hover{background:#fff;color:var(--ink)}
.btn-sm{padding:9px 14px;font-size:13px}

/* ---------- placeholder visual (no image uploaded yet) ---------- */
.vis{position:relative;overflow:hidden;background:var(--ink)}
.vis img{width:100%;height:100%;object-fit:cover;display:block}
.ph{position:absolute;inset:0;background:
  radial-gradient(120% 90% at var(--px,80%) var(--py,10%), rgba(82,48,194,.85), transparent 60%),
  linear-gradient(var(--pa,135deg), var(--ink-3), var(--ink) 70%)}
.ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 1px, transparent 1px 64px)}
.ph::after{content:"";position:absolute;right:-6%;top:-10%;width:46%;aspect-ratio:1;max-width:100%;
  background:linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,0));
  clip-path:polygon(40% 0,100% 0,100% 62%,60% 100%,60% 30%,0 30%)}

/* ---------- header ---------- */
.hd{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);z-index:50;transition:background .35s var(--ease),box-shadow .35s,color .35s;color:#fff}
.hd-in{display:flex;align-items:center;justify-content:space-between;height:88px;gap:24px}
.hd .logo img{height:30px;width:auto;display:block}
.hd .logo .l-dark{display:none}
.hd.solid{background:rgba(255,255,255,.96);backdrop-filter:blur(10px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.hd.solid .logo .l-dark{display:block}.hd.solid .logo .l-white{display:none}
.hd.solid .hd-in{height:72px}
.gnb{display:flex;gap:clamp(20px,3.4vw,52px)}
.gnb a{font-size:16px;font-weight:500;position:relative;padding:8px 0}
.gnb a::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.gnb a:hover::after,.gnb a.on::after{transform:scaleX(1)}
.hd-util{display:flex;align-items:center;gap:18px;font-size:13px}
.lang{opacity:.7;font-family:var(--f-display);letter-spacing:.08em}
.support-btn{border:1px solid currentColor;padding:8px 16px;border-radius:999px;font-size:13px;font-weight:500;opacity:.9;transition:background .25s,color .25s,border-color .25s;white-space:nowrap}
.support-btn:hover{background:var(--violet);border-color:var(--violet);color:#fff;opacity:1}
.slide video{width:100%;height:100%;object-fit:cover;display:block}
.vis video{width:100%;height:100%;object-fit:cover;display:block}
.vision{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.vision div{background:var(--paper);padding:36px 32px;display:grid;gap:12px;align-content:start}
.vision .n{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet)}
.vision b{font-size:20px;color:var(--ink)}
.vision p{color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.tile{position:relative;overflow:hidden;color:#fff;min-height:260px;display:flex;flex-direction:column;justify-content:flex-end;padding:40px}
.tile .vis{position:absolute;inset:0}
.tile .vis .ph{transition:transform .8s var(--ease)}
.tile:hover .vis .ph{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.1),rgba(11,10,69,.75))}
.tile>*:not(.vis){position:relative;z-index:2}
.tile h3{font-size:clamp(22px,2.2vw,28px);margin:10px 0 6px}
.tile p{color:var(--on-dark-2);font-size:15px}
.tile .go{margin-top:20px;display:inline-flex;align-items:center;gap:8px;font-size:14px}
.pillars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.pillar{padding:8px 36px 8px 32px;border-left:1px solid var(--on-dark-line);display:grid;gap:14px;align-content:start}
.pillar .n{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet-soft)}
.pillar h3{font-size:clamp(21px,2vw,26px);font-weight:700;line-height:1.4;color:#fff}
.pillar p{color:var(--on-dark-2);white-space:pre-line;font-size:15px;line-height:1.9}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.fact{border:1px solid var(--line);background:var(--paper);padding:30px 30px 26px;min-height:220px;display:flex;flex-direction:column;gap:8px;transition:border-color .3s var(--ease),transform .3s var(--ease),box-shadow .3s}
.fact:hover{border-color:var(--violet);transform:translateY(-4px);box-shadow:0 18px 36px -24px rgba(11,10,69,.35)}
.fact b{font-size:16px;color:var(--ink)}
.fact p{color:#4A4868;white-space:pre-line;font-size:15px;line-height:1.75;overflow-wrap:anywhere}
.fact svg{margin-top:auto;align-self:flex-end;color:var(--violet);width:44px;height:44px;flex:none}
@media (max-width:1080px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.pillars{grid-template-columns:minmax(0,1fr);gap:40px}}
@media (max-width:520px){.facts{grid-template-columns:minmax(0,1fr)}.fact{min-height:0}.fact svg{width:36px;height:36px}}
.sites{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.site-card{border:1px solid var(--line);padding:32px;display:grid;gap:14px;background:var(--paper)}
.site-card h3{font-size:20px;color:var(--ink)}
.site-card dl{margin:0;display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px 16px;font-size:15px}
.site-card dt{color:var(--muted)}.site-card dd{margin:0}
@media (max-width:760px){.tiles,.sites{grid-template-columns:minmax(0,1fr)}.support-btn{display:none}}
.icon-btn{background:none;border:0;padding:6px;display:grid;place-items:center;color:inherit}
.full-menu{position:fixed;inset:0;z-index:70;background:var(--ink);color:#fff;padding:env(safe-area-inset-top,0px) var(--gut-r) env(safe-area-inset-bottom,0px) var(--gut);overflow:auto;transform:translateY(-100%);transition:transform .55s var(--ease);visibility:hidden}
.full-menu.open{transform:none;visibility:visible}
.fm-top{display:flex;justify-content:space-between;align-items:center;height:88px;border-bottom:1px solid var(--on-dark-line)}
.fm-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0;padding:56px 0}
.fm-grid a.fm-item{display:block;padding:28px 24px;border-left:1px solid var(--on-dark-line);transition:background .3s}
.fm-grid a.fm-item:hover{background:rgba(255,255,255,.04)}
.fm-item .n{font-family:var(--f-display);font-size:12px;color:var(--violet-soft);letter-spacing:.2em}
.fm-item .t{font-size:clamp(22px,2.4vw,30px);font-weight:700;margin-top:14px;display:block}
.fm-item .s{font-size:14px;color:var(--on-dark-2);margin-top:12px;display:block;line-height:1.9}

/* ---------- hero ---------- */
.hero{position:relative;height:clamp(600px,88vh,880px);color:#fff;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .vis{position:absolute;inset:0}
.slide .vis img,.slide .ph{transform:scale(1.08);transition:transform 7s linear}
.slide.on .vis img,.slide.on .ph{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,69,.92) 0%,rgba(11,10,69,.55) 55%,rgba(11,10,69,.15))}
.hero-copy{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero-copy .wrap{width:100%}
.hero h1{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,6.4vw,92px);line-height:1.04;letter-spacing:-.035em;max-width:14ch;margin:22px 0 28px}
.hero h1 b{font-weight:700}
.hero .sub{font-size:clamp(16px,1.5vw,20px);color:var(--on-dark-2);max-width:40ch;white-space:pre-line}
.hero .ctas{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.slide.on .anim{animation:rise .9s var(--ease) both}
.slide.on .anim.d2{animation-delay:.12s}.slide.on .anim.d3{animation-delay:.24s}.slide.on .anim.d4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-ctrl{position:absolute;z-index:3;left:0;right:0;bottom:56px}
.hero-ctrl .wrap{display:flex;align-items:center;gap:20px}
.hero-ctrl .cur{font-family:var(--f-display);font-weight:600;font-size:14px}
.hero-ctrl .tot{font-family:var(--f-display);font-size:14px;opacity:.5}
.bar{width:min(240px,30vw);height:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--violet-soft);transform-origin:left;transform:scaleX(0)}
.bar i.run{animation:prog var(--dur,6s) linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center;transition:background .25s,border-color .25s}
.circ:hover{background:#fff;color:var(--ink)}
.scroll-cue{margin-left:auto;display:flex;align-items:center;gap:14px;font-family:var(--f-display);font-size:11px;letter-spacing:.3em;opacity:.7}
.scroll-cue i{display:block;width:56px;height:1px;background:rgba(255,255,255,.4);position:relative;overflow:hidden}
.scroll-cue i::after{content:"";position:absolute;inset:0;background:#fff;animation:cue 2.2s var(--ease) infinite}
@keyframes cue{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

/* ---------- sections ---------- */
.sec{padding-block:clamp(88px,11vw,150px)}
.sec.mist{background:var(--mist)}
.dark{background:var(--ink);color:#fff}
.sec-hd{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap;margin-bottom:clamp(40px,5vw,64px)}
.sec-hd h2{font-size:clamp(30px,3.6vw,48px);font-weight:700;margin-top:14px;line-height:1.25}
.sec-hd .lead{color:var(--muted);max-width:42ch}
.dark .sec-hd .lead{color:var(--on-dark-2)}
.more-link{display:inline-flex;align-items:center;gap:12px;font-family:var(--f-display);font-size:12px;font-weight:600;letter-spacing:.2em}
.more-link i{display:block;width:36px;height:1px;background:currentColor;transition:width .3s var(--ease)}
.more-link:hover i{width:56px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));padding-block:72px}
.stat{padding:0 28px;border-left:1px solid var(--on-dark-line)}
.stat .v{font-size:clamp(38px,4.4vw,60px);font-weight:600;line-height:1.1;letter-spacing:-.03em}
.stat .v em{font-style:normal;color:var(--violet-soft)}
.stat .l{color:var(--on-dark-2);font-size:14px;margin-top:10px}

/* business cards (accordion-like hover expand) */
.biz{display:flex;gap:16px;height:540px}
.biz-card{position:relative;flex:1;min-width:0;overflow:hidden;color:#fff;transition:flex .6s var(--ease)}
.biz-card .vis{position:absolute;inset:0}
.biz-card::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.05) 20%,rgba(11,10,69,.92));transition:background .5s}
.biz-card .in{position:absolute;z-index:2;left:32px;right:32px;bottom:36px}
.biz-card .no{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet-soft)}
.biz-card h3{font-family:var(--f-display);font-size:clamp(22px,2vw,28px);font-weight:600;margin:10px 0 8px;line-height:1.2}
.biz-card .ko{font-size:15px;color:var(--on-dark-2)}
.biz-card .desc{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .4s;font-size:14px;color:var(--on-dark-2);max-width:36ch}
.biz-card .line{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease);z-index:3}
.biz:hover .biz-card{flex:1}
.biz .biz-card:hover,.biz:not(:hover) .biz-card:first-child{flex:1.9}
.biz .biz-card:hover .desc,.biz:not(:hover) .biz-card:first-child .desc{max-height:120px;opacity:1;margin-top:14px}
.biz .biz-card:hover .line,.biz:not(:hover) .biz-card:first-child .line{transform:scaleX(1)}

/* product scroller */
.scroller-hd{display:flex;align-items:center;gap:14px}
.scroller-hd .cnt{font-family:var(--f-display);font-size:14px;color:var(--muted);min-width:56px;text-align:right}
.circ-dk{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.circ-dk:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:none;padding-left:max(24px,calc((100vw - var(--wrap)) / 2));padding-right:max(24px,var(--gut-r));scroll-padding-left:max(24px,calc((100vw - var(--wrap)) / 2))}
.track::-webkit-scrollbar{display:none}
.p-card{flex:0 0 clamp(280px,32vw,420px);scroll-snap-align:start;background:var(--paper);display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s}
.p-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -24px rgba(11,10,69,.35)}
.p-card .vis{aspect-ratio:4/3;max-width:100%}
.p-card .vis img{transition:transform .8s var(--ease)}
.p-card:hover .vis img{transform:scale(1.05)}
.p-card .b{padding:28px 30px 32px;display:flex;flex-direction:column;gap:10px;flex:1}
.p-card h3{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--ink)}
.p-card p{color:var(--muted);font-size:14px}
.p-card .go{margin-top:auto;padding-top:12px;font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:40px;background:var(--paper)}
.mq-row{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq-row span{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,8vw,112px);line-height:1;letter-spacing:-.03em;color:var(--ink);padding-right:.5em;white-space:nowrap}
.mq-row span.o{color:transparent;-webkit-text-stroke:1px rgba(11,10,69,.35)}
.mq-row span.d{color:var(--violet)}
@keyframes mq{to{transform:translateX(-50%)}}

/* news */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:9px 20px;font-size:14px;color:var(--muted);transition:all .25s}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.news-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:32px}
.n-card{display:flex;flex-direction:column;gap:18px}
.n-card .vis{aspect-ratio:3/2;max-width:100%}
.n-card .vis img{transition:transform .8s var(--ease)}
.n-card:hover .vis img{transform:scale(1.05)}
.n-card h3{font-size:19px;font-weight:500;line-height:1.5;transition:color .2s}
.n-card:hover h3{color:var(--violet)}
.meta{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;background:var(--lilac);color:var(--violet);letter-spacing:0;white-space:nowrap}
.badge.ink{background:var(--ink);color:#fff}
.badge.new{background:var(--violet);color:#fff;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}
.badge.off{background:var(--mist);color:var(--muted);border:1px solid var(--line)}
.n-list{border-top:2px solid var(--ink)}
.n-list .hd2{display:flex;justify-content:space-between;align-items:center;padding:0 0 16px;margin-top:-46px}
.n-list a.r{display:flex;align-items:center;gap:12px;padding:19px 0;border-bottom:1px solid var(--line);transition:padding .25s var(--ease)}
.n-list a.r:hover{padding-left:8px}
.n-list a.r .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-list a.r:hover .t{color:var(--violet)}

/* partners */
.logos{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.logos .row{display:flex;gap:20px;width:max-content;animation:mq 30s linear infinite}
.logo-chip{width:200px;height:88px;flex:none;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.06em;padding:16px}
.logo-chip img{max-height:44px;max-width:150px;object-fit:contain;filter:grayscale(1);opacity:.75;transition:all .3s}
.logo-chip:hover img{filter:none;opacity:1}

/* CTA */
.cta{position:relative;overflow:hidden}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;position:relative;z-index:2;padding-block:110px}
.cta h2{font-size:clamp(28px,3.2vw,42px);font-weight:700;margin:16px 0 12px;max-width:22ch}
.cta p{color:var(--on-dark-2)}
.cta .ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta::before{content:"";position:absolute;right:-8%;top:-30%;width:560px;max-width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(82,48,194,.55),transparent 65%)}

/* footer */
.ft{background:#07062F;color:var(--on-dark-2);font-size:14px}
.ft .top{display:flex;justify-content:space-between;gap:48px;flex-wrap:wrap;padding-block:72px 48px}
.ft img{height:28px;width:auto;margin-bottom:22px}
.ft .info{line-height:2;max-width:56ch}
.ft .cols{display:flex;gap:56px;flex-wrap:wrap}
.ft .cols h4{color:#fff;font-size:14px;font-weight:500;margin-bottom:14px}
.ft .cols a{display:block;line-height:2.2;transition:color .2s}
.ft .cols a:hover{color:#fff}
.ft .bot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--on-dark-line);padding-block:24px 32px;font-size:13px}
.ft .bot a{margin-left:20px}
.ft .bot a:first-child{margin-left:0;color:#fff}

/* sub pages */
.sub-vis{position:relative;height:440px;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.sub-vis .vis{position:absolute;inset:0}
.sub-vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.55),rgba(11,10,69,.85))}
.sub-vis .wrap{position:relative;z-index:2;width:100%;padding-bottom:64px}
.sub-vis h1{font-size:clamp(34px,4.6vw,60px);font-weight:700;margin:14px 0 12px}
.crumb{font-size:13px;color:var(--on-dark-2);font-family:var(--f-display);letter-spacing:.04em}
.lnb{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:20}
.lnb .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.lnb a,.lnb button{padding:22px 26px;font-size:15px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.lnb .on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}

.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px);align-items:start}
.about-grid .vis{aspect-ratio:4/5;max-width:100%}
.ceo-msg{font-size:17px;color:#38365A;white-space:pre-line;line-height:2}
.ceo-sign{margin-top:36px;font-size:15px;color:var(--muted)}
.ceo-sign b{font-size:20px;color:var(--ink);margin-left:10px}
.timeline{display:grid;gap:0;border-top:1px solid var(--line)}
.tl-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
.tl-row .y{font-family:var(--f-display);font-size:32px;font-weight:600;color:var(--ink);line-height:1.1}
.tl-row .t{white-space:pre-line;color:#38365A}
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.loc dl{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px 20px}
.loc dt{color:var(--muted);font-size:14px}.loc dd{margin:0}
.map-ph{aspect-ratio:16/10;max-width:100%;background:var(--mist);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;position:relative;overflow:hidden}
.map-ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 40px);opacity:.6}
.map-ph span{position:relative;background:var(--paper);padding:10px 16px;border:1px solid var(--line)}

.biz-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:center;padding-block:56px;border-bottom:1px solid var(--line)}
.biz-row:nth-child(even) .vis{order:2}
.biz-row .vis{aspect-ratio:4/3;max-width:100%}
.biz-row h3{font-family:var(--f-display);font-size:clamp(26px,3vw,38px);font-weight:600;color:var(--ink);margin:14px 0 6px}
.biz-row .ko{font-size:18px;font-weight:500;margin-bottom:20px}
.biz-row p{color:#4A4868;white-space:pre-line}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
.w-card .vis{aspect-ratio:4/3;max-width:100%}
.w-card .vis::after{content:"";position:absolute;inset:0;background:rgba(82,48,194,.0);transition:background .4s}
.w-card:hover .vis::after{background:rgba(82,48,194,.25)}
.w-card .b{padding-top:18px;display:grid;gap:6px}
.w-card h3{font-size:18px;font-weight:500}

.board-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.board-tools .total b{color:var(--violet)}
.search{display:flex}
.search input{border:1px solid var(--line-2);border-right:0;padding:12px 16px;width:min(320px,60vw);background:var(--paper);outline-offset:-2px}
.search button{border:0;background:var(--ink);color:#fff;width:48px;display:grid;place-items:center}
.board{width:100%;border-collapse:collapse;border-top:2px solid var(--ink)}
.board th{font-weight:500;font-size:14px;padding:18px 12px;background:var(--mist);border-bottom:1px solid var(--line)}
.board td{padding:22px 12px;border-bottom:1px solid var(--line);font-size:15px;text-align:center;color:var(--muted)}
.board td.t{text-align:left;color:var(--text)}
.board td.t a{display:inline-flex;align-items:center;gap:10px}
.board td.t a:hover span{color:var(--violet);text-decoration:underline;text-underline-offset:4px}
.board tr.pin td{background:#FAF9FE}
.board tr.pin td.t{font-weight:500;color:var(--ink)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:40px}
.pager button{width:40px;height:40px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-display);font-size:14px}
.pager button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
.empty{padding:72px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);background:var(--mist)}

.post-hd{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:36px 0}
.post-hd h1{font-size:clamp(24px,2.6vw,32px);font-weight:700;margin:14px 0}
.post-body{padding:48px 0 64px;font-size:17px;line-height:2;color:#2F2D4E;white-space:pre-line;border-bottom:1px solid var(--line);max-width:80ch}
.post-body .vis{margin-bottom:36px;aspect-ratio:16/9;max-width:100%}
.post-nav{border-bottom:1px solid var(--line)}
.post-nav a{display:flex;gap:24px;padding:20px 8px;border-bottom:1px solid var(--line);font-size:15px}
.post-nav a:last-child{border-bottom:0}
.post-nav a span:first-child{color:var(--muted);width:64px;flex:none}
.post-nav a:hover span:last-child{color:var(--violet)}

.contact-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px)}
.c-info{display:grid;gap:28px;align-content:start}
.c-info .k{font-size:13px;color:var(--muted);margin-bottom:4px}
.c-info .v{font-size:20px;font-weight:500;color:var(--ink)}
.form{display:grid;gap:18px}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.field{display:grid;gap:8px}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--paper);padding:13px 14px;width:100%;border-radius:0;outline-offset:-2px}
.field textarea{min-height:160px;resize:vertical}
.note{font-size:13px;color:var(--muted)}

/* popups */
.pop-layer{position:fixed;inset:0;z-index:80;background:rgba(7,6,47,.6);display:flex;align-items:center;justify-content:center;gap:20px;padding:max(24px,env(safe-area-inset-top,0px)) var(--gut-r) 24px var(--gut);flex-wrap:wrap;overflow:auto;animation:fade .35s}
@keyframes fade{from{opacity:0}}
.pop{width:min(400px,100%);background:var(--paper);box-shadow:0 32px 64px -24px rgba(0,0,0,.5);animation:rise .5s var(--ease) both}
.pop .vis{aspect-ratio:10/9;max-width:100%;color:#fff}
.pop .vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,10,69,.85))}
.pop .pc{position:absolute;z-index:2;left:32px;right:32px;bottom:30px}
.pop .pc h3{font-size:26px;font-weight:700;margin:10px 0 8px;line-height:1.35;white-space:pre-line}
.pop .pc p{font-size:14px;color:var(--on-dark-2);white-space:pre-line}
.pop .act{padding:20px 24px}
.pop .act .btn{width:100%;justify-content:center}
.pop .foot{display:flex;justify-content:space-between;align-items:center;background:var(--mist);padding:12px 24px;font-size:13px}
.pop .foot label{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.pop .foot button{border:0;background:none;font-weight:500}

.edit-fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;background:var(--violet);color:#fff;padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 12px 30px -10px rgba(82,48,194,.7)}
.edit-fab:hover{background:var(--ink)}

.reveal.in{animation:rise .9s var(--ease) both}
.toast{position:fixed;left:50%;bottom:max(28px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;padding:12px 20px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:rise .35s var(--ease) both;max-width:calc(100vw - 32px)}
.toast.err{background:var(--danger)}
.notice-bar{background:var(--lilac);color:var(--ink);font-size:13px;text-align:center;padding:10px 16px}

/* ============ ADMIN ============ */
.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--mist)}
.adm-side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:28px 0 24px;display:flex;flex-direction:column}
.adm-side .brand{padding:0 28px 28px;border-bottom:1px solid var(--on-dark-line)}
.adm-side .brand img{height:24px;width:auto}
.adm-side .brand small{display:block;margin-top:10px;font-family:var(--f-display);letter-spacing:.2em;font-size:11px;color:var(--violet-soft)}
.adm-nav{padding:16px 12px;display:grid;gap:2px}
.adm-nav .grp{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.4);padding:18px 16px 8px;font-family:var(--f-display)}
.adm-nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;color:var(--on-dark-2);border-radius:6px;transition:background .2s,color .2s}
.adm-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.adm-nav a.on{background:var(--violet);color:#fff}
.adm-nav a .c{font-family:var(--f-display);font-size:12px;opacity:.7}
.adm-side .bottom{margin-top:auto;padding:16px 28px 0;border-top:1px solid var(--on-dark-line);font-size:13px}
.adm-side .bottom a{display:flex;align-items:center;gap:8px;color:var(--on-dark-2);padding:8px 0}
.adm-side .bottom a:hover{color:#fff}
.adm-main{min-width:0;padding:0 0 80px}
.adm-top{position:sticky;top:0;z-index:20;background:rgba(246,245,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.adm-top h1{font-size:22px;font-weight:700;color:var(--ink)}
.adm-top .desc{font-size:13px;color:var(--muted);margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ok);background:#E8F5EE;padding:6px 12px;border-radius:999px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.off{color:var(--muted);background:var(--paper);border:1px solid var(--line)}.live.off i{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.3}}
.adm-body{padding:32px 40px;display:grid;gap:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-hd h2{font-size:16px;font-weight:700;color:var(--ink)}
.panel-bd{padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:4px;transition:border-color .2s}
.kpi:hover{border-color:var(--violet)}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink)}
.kpi .s{font-size:12px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.how div{background:var(--mist);border-radius:8px;padding:18px}
.how b{display:block;color:var(--ink);margin-bottom:6px;font-size:15px}
.how p{font-size:13px;color:var(--muted);line-height:1.7}

.seg{display:flex;gap:4px;background:var(--mist);padding:4px;border-radius:8px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 14px;border-radius:6px;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--paper);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.a-tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.a-search{border:1px solid var(--line-2);border-radius:6px;padding:8px 12px;font-size:14px;width:200px;background:var(--paper)}
.abtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--paper);border-radius:6px;padding:8px 14px;font-size:13px;font-weight:500;color:var(--ink);transition:all .2s;white-space:nowrap}
.abtn:hover{border-color:var(--ink)}
.abtn.pri{background:var(--violet);border-color:var(--violet);color:#fff}
.abtn.pri:hover{background:var(--ink);border-color:var(--ink)}
.abtn.dan{color:var(--danger);border-color:#F0CACA}
.abtn.dan.solid{background:var(--danger);color:#fff;border-color:var(--danger)}
.abtn:disabled{opacity:.45;cursor:default}

.sort-list{display:grid}
.s-row{display:grid;grid-template-columns:28px 34px 72px minmax(0,1fr) auto auto auto;align-items:center;gap:14px;padding:12px 22px;border-bottom:1px solid var(--line);background:var(--paper);transition:background .2s,box-shadow .2s}
.s-row:last-child{border-bottom:0}
.s-row:hover{background:#FCFBFF}
.s-row.dragging{opacity:.4}
.s-row.drop-before{box-shadow:inset 0 2px 0 var(--violet)}
.s-row.drop-after{box-shadow:inset 0 -2px 0 var(--violet)}
.s-row.flash{animation:flash 1.2s}
@keyframes flash{0%{background:var(--lilac)}100%{background:var(--paper)}}
.grip{cursor:grab;color:var(--muted);display:grid;place-items:center;border:0;background:none;padding:4px}
.grip:active{cursor:grabbing}
.ord{font-family:var(--f-display);font-size:13px;color:var(--muted);text-align:center}
.thumb{width:72px;height:46px;border-radius:4px;position:relative;overflow:hidden;background:var(--ink)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.txt{background:var(--mist);display:grid;place-items:center;font-family:var(--f-display);font-size:12px;color:var(--muted);font-weight:600}
.s-main{min-width:0}
.s-main .t{font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:8px;align-items:center}
.s-main .t span{overflow:hidden;text-overflow:ellipsis}
.s-main .m{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{width:44px;height:24px;border-radius:12px;background:var(--line-2);border:0;position:relative;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .25s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.tg.on{background:var(--violet)}.tg.on::after{transform:translateX(20px)}
.tg-wrap{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);min-width:96px}
.updown{display:flex;gap:4px}
.updown button{width:30px;height:30px;border:1px solid var(--line-2);border-radius:6px;background:var(--paper);display:grid;place-items:center;color:var(--ink)}
.updown button:hover:not(:disabled){border-color:var(--ink)}
.updown button:disabled{opacity:.3;cursor:default}
.r-act{display:flex;gap:6px}
.hint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:12px 22px;background:var(--mist);border-bottom:1px solid var(--line)}

.drawer-bg{position:fixed;inset:0;z-index:90;background:rgba(7,6,47,.35);animation:fade .25s}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:91;width:min(560px,100%);background:var(--paper);display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.3);animation:slide .35s var(--ease);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.drawer .d-hd{display:flex;justify-content:space-between;align-items:center;padding:20px 26px;border-bottom:1px solid var(--line)}
.drawer .d-hd h2{font-size:18px;font-weight:700;color:var(--ink)}
.drawer .d-bd{flex:1;overflow:auto;padding:24px 26px;display:grid;gap:20px;align-content:start}
.drawer .d-ft{display:flex;justify-content:space-between;gap:10px;padding:16px 26px;border-top:1px solid var(--line);background:var(--mist);padding-right:max(26px,env(safe-area-inset-right,0px))}
.af{display:grid;gap:8px}
.af>label{font-size:13px;font-weight:500;color:var(--ink)}
.af .help{font-size:12px;color:var(--muted)}
.af input[type=text],.af input[type=date],.af input[type=url],.af select,.af textarea{border:1px solid var(--line-2);border-radius:6px;padding:10px 12px;font-size:14px;width:100%;background:var(--paper)}
.af textarea{min-height:110px;resize:vertical;line-height:1.7}
.af textarea.tall{min-height:260px}
.af .row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.img-field{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.img-field .prev{width:160px;height:100px;border-radius:6px;overflow:hidden;position:relative;background:var(--ink);flex:none}
.img-field .prev img{width:100%;height:100%;object-fit:cover}
.img-field .btns{display:grid;gap:6px}
.chk{display:flex;align-items:center;gap:10px;font-size:14px}
.stats-ed{display:grid;gap:8px}
.stats-ed .r{display:grid;grid-template-columns:90px 60px minmax(0,1fr);gap:8px}
.stats-ed input{border:1px solid var(--line-2);border-radius:6px;padding:9px 10px;font-size:14px;width:100%}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.form-grid .full{grid-column:1/-1}
.inq{display:grid;gap:0}
.inq .r{display:grid;grid-template-columns:130px minmax(0,1fr) 140px;gap:16px;padding:16px 22px;border-bottom:1px solid var(--line);font-size:14px}
.inq .r:last-child{border-bottom:0}
.inq .r .b{white-space:pre-line;color:#3A385C}
.adm-gate{min-height:100vh;display:grid;place-items:center;background:var(--ink);color:#fff;padding:24px var(--gut-r) 24px var(--gut);text-align:center}
.adm-gate .box{max-width:440px;display:grid;gap:18px;justify-items:center}
.adm-gate img{height:30px}
.adm-gate p{color:var(--on-dark-2)}
.adm-mtop{display:none}

/* ---------- responsive ---------- */
@media (max-width:1080px){
  .gnb{display:none}
  .news-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .news-grid .n-list{grid-column:1/-1;margin-top:40px}
  .grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .biz{flex-direction:column;height:auto}
  .biz-card{height:300px;flex:none!important}
  .biz-card .desc{max-height:none;opacity:1;margin-top:10px}
  .biz-card .line{transform:scaleX(1)}
  .adm{grid-template-columns:minmax(0,1fr)}
  .adm-side{display:none}
  .adm-mtop{display:block;background:var(--ink);color:#fff;padding:14px 0 0}
  .adm-mtop .t{display:flex;justify-content:space-between;align-items:center;padding:0 max(16px,var(--gut-r)) 0 max(16px,var(--gut))}
  .adm-mtop img{height:20px}
  .adm-mtop nav{display:flex;gap:4px;overflow-x:auto;padding:12px max(16px,var(--gut-r)) 12px max(16px,var(--gut));scrollbar-width:none}
  .adm-mtop nav a{white-space:nowrap;font-size:13px;padding:7px 12px;border-radius:999px;color:var(--on-dark-2);border:1px solid var(--on-dark-line)}
  .adm-mtop nav a.on{background:var(--violet);border-color:var(--violet);color:#fff}

/* ================= routing ================= */

/* ================= site interactions ================= */
let heroTimer = 0;
function startHero(){
  clearTimeout(heroTimer);
  const bar = $("#heroBar"); if (!bar) return;
  const n = document.querySelectorAll(".slide").length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  bar.classList.remove("run"); void bar.offsetWidth;
  if (n < 2 || reduce) { bar.style.transform = "scaleX(1)"; return; }
  bar.classList.add("run");
  heroTimer = setTimeout(() => goSlide(ui.slide+1), 6000);
}
function goSlide(i){
  const slides = document.querySelectorAll(".slide"); const n = slides.length; if (!n) return;
  ui.slide = (i+n)%n;
  slides.forEach((s,k) => { s.classList.toggle("on", k===ui.slide); s.setAttribute("aria-hidden", k!==ui.slide); });
  const c = $(".hero-ctrl .cur"); if (c) c.textContent = String(ui.slide+1).padStart(2,"0");
  startHero();
}
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; const el = e.target; io.unobserve(el);
    el.classList.add("in");
    el.querySelectorAll("[data-count]").forEach(countUp);
  }), {threshold:.2});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}
function countUp(el){
  const to = parseFloat(el.dataset.count); if (isNaN(to) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const comma = el.dataset.fmt==="comma"; const t0 = performance.now(), dur = 1600;
  const f = t => { const p = Math.min(1,(t-t0)/dur), v = Math.round(to*(1-Math.pow(1-p,3)));
    el.textContent = comma ? v.toLocaleString("en-US") : v; if (p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function maybePopups(){
  if (ui.popDone || route()!=="home" || !S.loaded) return;
  ui.popDone = true;
  const t = today();
  const list = shown("popups", p => (!p.start || p.start<=t) && (!p.end || p.end>=t)).filter(p => { try { return localStorage.getItem("tz-pop-"+p.id)!==t; } catch { return true; } }).slice(0,3);
  if (!list.length) return;
  const root = $("#popRoot");
  root.innerHTML = `<div class="pop-layer" role="dialog" aria-modal="true" aria-label="알림 팝업">${list.map((p,i) => `<div class="pop" data-pop="${esc(p.id)}">
    <div class="vis">${p.imageId?`<img src="${imgUrl(p.imageId)}" alt="">`:`<div class="ph" style="--pa:${[150,120,170][i]}deg"></div>`}<div class="pc"><p class="eyebrow">${esc(p.eyebrow)}</p><h3>${esc(p.title)}</h3><p>${esc(p.body)}</p></div></div>

    <div class="foot"><label><input type="checkbox" data-today="${esc(p.id)}"> 오늘 하루 보지 않기</label><button data-popclose="${esc(p.id)}">닫기 ✕</button></div></div>`).join("")}</div>`;
}
document.addEventListener("click", e => {
  const pc = e.target.closest("[data-popclose]");
  if (pc){
    const id = pc.dataset.popclose, box = document.querySelector(`[data-pop="${CSS.escape(id)}"]`);
    if (box && box.querySelector("[data-today]")?.checked) { try { localStorage.setItem("tz-pop-"+id, today()); } catch {} }
    box?.remove(); if (!document.querySelector(".pop")) $("#popRoot").innerHTML = "";
    return;
  }
  const a = e.target.closest("[data-act]");
  if (a){
    const act = a.dataset.act, tr = $("#pTrack");
    if (act==="prev") goSlide(ui.slide-1);
    if (act==="next") goSlide(ui.slide+1);
    if ((act==="pprev"||act==="pnext") && tr){ const w = tr.querySelector(".p-card")?.offsetWidth || 400; tr.scrollBy({left:(act==="pnext"?1:-1)*(w+24),behavior:"smooth"}); }
    return;
  }
  const ht = e.target.closest("[data-hometab]"); if (ht){ ui.homeTab = ht.dataset.hometab; render(false); return; }
  const bd = e.target.closest("[data-board]"); if (bd){ ui.board = bd.dataset.board; ui.page = 1; ui.q=""; render(false); return; }
  const pg = e.target.closest("[data-page]"); if (pg && !pg.disabled){ ui.page = +pg.dataset.page; render(false); $(".lnb")?.scrollIntoView({behavior:"smooth"}); return; }
  const ct = e.target.closest("[data-cat]"); if (ct){ ui.prodCat = ct.dataset.cat; render(false); return; }
  const ja = e.target.closest("[data-jump-after]"); if (ja){ const id = ja.dataset.jumpAfter; setTimeout(() => document.getElementById(id)?.scrollIntoView({behavior:"smooth"}), 120); }
  const jp = e.target.closest("[data-jump]"); if (jp){ e.preventDefault(); document.getElementById(jp.dataset.jump)?.scrollIntoView({behavior:"smooth"}); }
});
document.addEventListener("submit", async e => {
  if (e.target.id==="bSearch"){ e.preventDefault(); ui.q = $("#bq").value; ui.page = 1; render(false); return; }
  if (e.target.id==="inqForm"){

function wireTrack(){
  const tr = $("#pTrack"), cnt = $("#pCnt"); if (!tr || !cnt) return;
  const n = tr.children.length;
  tr.addEventListener("scroll", () => { const w = (tr.querySelector(".p-card")?.offsetWidth||400)+24; cnt.textContent = String(Math.min(n, Math.round(tr.scrollLeft/w)+1)).padStart(2,"0")+" / "+String(n).padStart(2,"0"); }, {passive:true});
  let down=false, sx=0, sl=0, moved=false;
  tr.addEventListener("pointerdown", e => { if (e.pointerType!=="mouse") return; down=true; moved=false; sx=e.clientX; sl=tr.scrollLeft; tr.style.scrollSnapType="none"; });
  window.addEventListener("pointermove", e => { if(!down) return; const d=e.clientX-sx; if(Math.abs(d)>4) moved=true; tr.scrollLeft = sl-d; });
  window.addEventListener("pointerup", () => { if(!down) return; down=false; tr.style.scrollSnapType=""; });
  tr.addEventListener("click", e => { if (moved){ e.preventDefault(); moved=false; } }, true);
}

  return `<form id="siteForm" class="panel"><div class="panel-hd"><h2>회사 정보</h2></div><div class="panel-bd form-grid">
      ${f("company","회사명 (국문)")}${f("companyEn","회사명 (영문)")}${f("ceo","대표이사","text","비워두면 표시하지 않습니다.")}${f("bizNo","사업자등록번호","text","비워두면 표시하지 않습니다.")}${f("tel","대표전화")}${f("fax","팩스")}${f("email","이메일")}${f("supportUrl","원격지원 프로그램 주소","text","https:// 로 시작하는 주소")}${f("address","본사 주소")}${f("address2","공장 주소")}
    </div>
    <div class="panel-hd" style="border-top:1px solid var(--line)"><h2>홈 · 주요 수치</h2><span class="note">숫자는 화면에 들어올 때 0부터 올라가며 표시됩니다.</span></div>
    <div class="panel-bd"><div class="stats-ed"><div class="r note"><span>숫자</span><span>단위</span><span>설명</span></div>${st.map((s,i) => `<div class="r"><input aria-label="수치 ${i+1} 숫자" data-st="${i}:num" value="${esc(s.num)}"><input aria-label="수치 ${i+1} 단위" data-st="${i}:suffix" value="${esc(s.suffix)}"><input aria-label="수치 ${i+1} 설명" data-st="${i}:label" value="${esc(s.label)}"></div>`).join("")}</div></div>
    <div class="panel-hd" style="border-top:1px solid var(--line)"><h2>문구</h2></div>
    <div class="panel-bd form-grid">
      ${f("bizLead","사업분야 소개 문구","textarea")}${f("marquee","흐르는 텍스트 (· 로 구분)")}${f("ctaTitle","문의 배너 제목")}${f("ctaText","문의 배너 설명","textarea")}
      ${f("aboutTitle","회사개요 제목","textarea")}${f("ceoMessage","회사개요 본문","textarea")}
      ${f("visionLead","비전 소개 문구","textarea")}${f("vision","비전 & 경영이념 항목","textarea","한 줄에 하나씩 ‘제목 | 설명’ 형식으로 입력하세요.")}
      ${f("supportText","원격지원 안내 문구","textarea")}
      <div class="af full"><label>회사개요 이미지 (권장 1000×1250)</label>${imgFieldHtml("ceoImageId", c.ceoImageId)}</div>
      <div class="af"><label>홈 · 고객문의 타일 이미지</label>${imgFieldHtml("tile1ImageId", c.tile1ImageId)}</div>
      <div class="af"><label>홈 · 원격지원 타일 이미지</label>${imgFieldHtml("tile2ImageId", c.tile2ImageId)}</div>
    </div>
    <div class="drawer d-ft" style="position:static;width:auto;box-shadow:none;animation:none;border-radius:0 0 10px 10px;justify-content:flex-end"><button class="abtn pri" type="submit">저장하고 반영</button></div>
  </form>`;
}
function admInquiries(){
  const all = S.inquiries.flatMap(d => (d.items||[])).sort((a,b) => (b.at||"").localeCompare(a.at||""));
  return `<div class="panel"><div class="panel-hd"><h2>접수 ${all.length}건</h2><span class="note">최신순</span></div>
  <div class="inq">${all.map(q => `<div class="r"><div><span class="badge">${esc(q.type)}</span><div class="meta" style="margin-top:6px">${esc((q.at||"").slice(0,16).replace("T"," "))}</div></div><div class="b"><b>${esc(q.name)}</b> · ${esc(q.contact)}\n${esc(q.body)}</div><div></div></div>`).join("") || `<div class="panel-bd"><div class="empty">아직 접수된 문의가 없습니다.</div></div>`}</div></div>`;
}
function imgFieldHtml(key, id, video){
  const media = id ? (video ? `<video src="${imgUrl(id)}" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${imgUrl(id)}" alt="">`) : '<div class="ph"></div>';
  return `<div class="img-field" data-imgfield="${key}"><div class="prev">${media}</div>
    <div class="btns"><label class="abtn" style="cursor:pointer">${assets?(video?"영상 업로드":"이미지 업로드"):"업로드 불가"}<input type="file" accept="${video?"video/mp4,video/webm":"image/*"}" hidden data-upload="${key}" data-kind="${video?"video":"image"}" ${assets?"":"disabled"}></label>${id?`<button type="button" class="abtn dan" data-imgclear="${key}">${video?"영상 빼기":"이미지 빼기"}</button>`:""}<span class="help">${id?"":(video?"영상이 없으면 이미지가 표시됩니다.":"이미지가 없으면 브랜드 그래픽이 대신 표시됩니다.")}</span></div>
    <input type="hidden" data-imgval="${key}" value="${esc(id||"")}"></div>`;
}

/* ---- admin wiring ---- */
let dragId = null;
function wireAdmin(sec){
  const q = $("#admQ");
  if (q){ q.addEventListener("input", () => { ui.admQ = q.value; const pos = q.selectionStart; render(false); const n=$("#admQ"); n.focus(); n.setSelectionRange(pos,pos); }); }
  const listEl = $("#sortList");
  if (listEl && !ui.admQ){
    listEl.addEventListener("dragstart", e => { const row = e.target.closest(".s-row"); if(!row) return; dragId = row.dataset.id; row.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; try{ e.dataTransfer.setData("text/plain", dragId);}catch{} });
    listEl.addEventListener("dragend", () => { dragId=null; listEl.querySelectorAll(".s-row").forEach(r=>r.classList.remove("dragging","drop-before","drop-after")); });
    listEl.addEventListener("dragover", e => { if(!dragId) return; e.preventDefault(); const row = e.target.closest(".s-row"); listEl.querySelectorAll(".s-row").forEach(r=>r.classList.remove("drop-before","drop-after")); if(!row||row.dataset.id===dragId) return; const b=row.getBoundingClientRect(); row.classList.add(e.clientY < b.top+b.height/2 ? "drop-before":"drop-after"); });
    listEl.addEventListener("drop", e => { e.preventDefault(); const row = e.target.closest(".s-row"); if(!row||!dragId||row.dataset.id===dragId) return; const before = row.classList.contains("drop-before"); reorder(sec, dragId, row.dataset.id, before); });
  }
  const sf = $("#siteForm"); if (sf) sf.addEventListener("submit", saveSite);
}
function currentList(c){ let l = sorted(c, c==="posts" ? (x => x.board===ui.admTab) : null); if (c==="posts") l = shownPostsSorted(l); return l; }
async function persistOrder(c, list, flashId){
  // optimistic local update, then write only documents whose order changed
  const changed = [];
  list.forEach((x,i) => { const o = i*10; if (x.order !== o){ changed.push([x.id,o]); const ref = S[c].find(y=>y.id===x.id); if (ref) S[c] = S[c].map(y => y.id===x.id ? {...y, order:o} : y); } });
  render(false);
  if (flashId) document.querySelector(`.s-row[data-id="${CSS.escape(flashId)}"]`)?.classList.add("flash");
  if (!db || !changed.length) return;
  try { for (const [id,o] of changed) await db.doc(`${c}/${id}`).update({order:o}); toast("순서를 저장했습니다. 홈페이지에 반영되었습니다."); }
  catch(e){ toast(dbErr(e), true); }
}
function reorder(c, fromId, toId, before){
  const list = currentList(c); const from = list.findIndex(x=>x.id===fromId); if (from<0) return;
  const [item] = list.splice(from,1); let to = list.findIndex(x=>x.id===toId); if (!before) to++; list.splice(to,0,item);
  persistOrder(c, list, fromId);
}
document.addEventListener("click", async e => {
  if (!route().startsWith("admin")) return;
  const t = e.target;
  const tab = t.closest("[data-admtab]"); if (tab){ ui.admTab = tab.dataset.admtab; render(false); return; }
  const mv = t.closest("[data-move]");
  if (mv && !mv.disabled){ const c = $("#sortList").dataset.col; const list = currentList(c); const i = list.findIndex(x=>x.id===mv.dataset.mid); const j = i + (+mv.dataset.move); if (j<0||j>=list.length) return; [list[i],list[j]]=[list[j],list[i]]; persistOrder(c, list, mv.dataset.mid); return; }
  const tg = t.closest("[data-toggle]");
  if (tg){ const c = $("#sortList").dataset.col, id = tg.dataset.toggle; const x = S[c].find(y=>y.id===id); const v = x.visible===false; S[c] = S[c].map(y=>y.id===id?{...y,visible:v}:y); render(false);
    if (db) try { await db.doc(`${c}/${id}`).update({visible:v}); toast(v?"홈페이지에 노출했습니다.":"홈페이지에서 숨겼습니다."); } catch(err){ toast(dbErr(err), true); } return; }
  const dl = t.closest("[data-del]"); if (dl){ ui.confirmDel = dl.dataset.del; render(false); return; }
  if (t.closest("[data-delno]")){ ui.confirmDel = null; render(false); return; }
  const ok = t.closest("[data-delok]");
  if (ok){ const c = $("#sortList").dataset.col, id = ok.dataset.delok; ui.confirmDel = null; S[c] = S[c].filter(y=>y.id!==id); render(false);
    if (db) try { await db.doc(`${c}/${id}`).delete(); toast("삭제했습니다."); } catch(err){ toast(dbErr(err), true); } return; }
  const ed = t.closest("[data-edit]"); if (ed){ const [c,id] = ed.dataset.edit.split(":"); openEditor(c, S[c].find(x=>x.id===id)); return; }
  const nw = t.closest("[data-new]"); if (nw){ openEditor(nw.dataset.new, null); return; }
});

/* ---- editor drawer ---- */
let editing = null;
function openEditor(c, item){
  const sch = SCHEMA[c]; editing = {c, id:item?.id || null};
  const v = item || {visible:true, featured:true, board:ui.admTab, date:today(), btnRoute:"about"};
  const fld = ([k,l,type,help]) => {
    const id = "ed-"+k;
    let input;
    if (type==="textarea"||type==="textarea-tall") input = `<textarea id="${id}" data-f="${k}" class="${type==="textarea-tall"?"tall":""}">${esc(v[k])}</textarea>`;
    else if (type==="route") input = `<select id="${id}" data-f="${k}">${ROUTE_OPTS.map(([r,lb]) => `<option value="${r}" ${v[k]===r?"selected":""}>${lb}</option>`).join("")}</select>`;
    else if (type==="icon") input = `<select id="${id}" data-f="${k}">${Object.entries(FACT_ICONS).map(([r,[lb]]) => `<option value="${r}" ${v[k]===r?"selected":""}>${lb}</option>`).join("")}</select>`;
    else if (type==="board") input = `<select id="${id}" data-f="${k}">${BOARDS.map(([r,lb]) => `<option value="${r}" ${v[k]===r?"selected":""}>${lb}</option>`).join("")}</select>`;
    else if (type==="bool") return `<label class="chk"><input type="checkbox" id="${id}" data-f="${k}" ${v[k]!==false&&(v[k]||k==="featured")?"checked":""}> ${l}</label>`;
    else if (type==="image"||type==="video") return `<div class="af"><label>${l}</label>${imgFieldHtml(k, v[k], type==="video")}</div>`;
    else input = `<input type="${type==="date"?"date":type==="url"?"url":"text"}" id="${id}" data-f="${k}" value="${esc(v[k])}">`;
    return `<div class="af"><label for="${id}">${l}</label>${input}${help?`<span class="help">${help}</span>`:""}</div>`;
  };
  $("#drawerRoot").innerHTML = `<div class="drawer-bg" data-close></div><form class="drawer" id="edForm" role="dialog" aria-modal="true" aria-label="${sch.label} ${item?"수정":"등록"}">
    <div class="d-hd"><h2>${sch.label} ${item?"수정":"새로 등록"}</h2><button type="button" class="icon-btn" data-close aria-label="닫기">${I.close}</button></div>
    <div class="d-bd">${sch.fields.map(fld).join("")}<label class="chk"><input type="checkbox" id="ed-visible" ${v.visible!==false?"checked":""}> 홈페이지에 노출</label></div>
    <div class="d-ft"><button type="button" class="abtn" data-close>취소</button><button type="submit" class="abtn pri">저장하고 반영</button></div></form>`;
  $("#edForm").addEventListener("submit", saveEditor);
  setTimeout(() => $("#edForm [data-f]")?.focus(), 50);
}
function closeDrawer(){ $("#drawerRoot").innerHTML = ""; editing = null; }
document.addEventListener("click", e => { if (e.target.closest("[data-close]")) closeDrawer(); });
async function saveEditor(e){
  e.preventDefault(); if (!editing) return;
  const {c, id} = editing; const sch = SCHEMA[c];
  const data = {};
  sch.fields.forEach(([k,,type]) => {
    if (type==="image"||type==="video"){ data[k] = $(`[data-imgval="${k}"]`).value || null; return; }
    const el = $(`#edForm [data-f="${k}"]`); if (!el) return;
    data[k] = type==="bool" ? el.checked : el.value.trim();
  });
  data.visible = $("#ed-visible").checked;
  data.updatedAt = new Date().toISOString();
  let newId = id;
  if (!id){
    newId = uid(c.slice(0,2));
    const peers = c==="posts" ? S.posts.filter(p=>p.board===data.board) : S[c];
    data.order = c==="posts" ? Math.min(0, ...peers.map(p=>p.order??0)) - 10 : Math.max(-10, ...peers.map(p=>p.order??0)) + 10;
  }
  const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "저장 중…";
  try {
    if (!db) throw {code:"unavailable"};
    if (id) await db.doc(`${c}/${id}`).update(data); else await db.doc(`${c}/${newId}`).set(data);
    closeDrawer(); toast("저장했습니다. 홈페이지에 바로 반영되었습니다.");
    if (c==="posts") ui.admTab = data.board;
  } catch(err){ toast(dbErr(err), true); btn.disabled = false; btn.textContent = "저장하고 반영"; }
}
async function saveSite(e){
  e.preventDefault();
  const data = {...S.config};
  document.querySelectorAll("[data-cf]").forEach(el => data[el.dataset.cf] = el.value.trim());
  const st = [0,1,2,3].map(()=>({}));
  document.querySelectorAll("[data-st]").forEach(el => { const [i,k] = el.dataset.st.split(":"); st[+i][k] = el.value.trim(); });
  data.stats = st.filter(s => s.num);
  ["ceoImageId","tile1ImageId","tile2ImageId"].forEach(k => data[k] = $(`[data-imgval="${k}"]`).value || null);
  data.updatedAt = new Date().toISOString();
  try { if (!db) throw {code:"unavailable"}; await db.doc("site/config").set(data); toast("기본 정보를 저장했습니다."); } catch(err){ toast(dbErr(err), true); }
}
document.addEventListener("change", async e => {
  const up = e.target.closest("[data-upload]"); if (!up) return;
  const key = up.dataset.upload, file = up.files[0]; if (!file || !assets) return;
  if (file.size > 20*1024*1024){ toast("20MB 이하 파일만 올릴 수 있습니다.", true); return; }
  const box = up.closest(".img-field"); box.querySelector(".help").textContent = "업로드 중…";
  try { const r = await assets.upload(file); box.querySelector(`[data-imgval="${key}"]`).value = r.id; box.querySelector(".prev").innerHTML = up.dataset.kind==="video" ? `<video src="${r.url}" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>` : `<img src="${r.url}" alt="">`; box.querySelector(".help").textContent = "업로드 완료 · 저장하면 반영됩니다."; }
  catch(err){ box.querySelector(".help").textContent = "업로드하지 못했습니다. 다른 이미지로 다시 시도하세요."; }
});
document.addEventListener("click", e => { const cl = e.target.closest("[data-imgclear]"); if (!cl) return; const box = cl.closest(".img-field"); box.querySelector(`[data-imgval="${cl.dataset.imgclear}"]`).value = ""; box.querySelector(".prev").innerHTML = '<div class="ph"></div>'; cl.remove(); });

/* ================= boot ================= */
render(true);
(async () => {
  const C = window.claude; if (!C || !C.use){ S.timedOut = true; render(false); return; }
  const timer = setTimeout(() => { if (!S.loaded){ S.timedOut = true; schedule(); } }, 10000);
  try { user = await C.use("user"); } catch {}
  try { db = await C.use("db"); } catch {}
  if (user){ try { canEdit = await user.canEdit(); } catch {} try { myId = await user.id(); } catch {} }
  if (canEdit){ try { assets = await C.use("assets"); } catch {} }
  if (!db){ clearTimeout(timer); S.timedOut = true; schedule(); return; }
  let pending = COLS.length + 1;
  const done = (snap) => { if (snap && snap.metadata && !snap.metadata.fromCache && !S.loaded && --pending <= 0){ S.loaded = true; clearTimeout(timer); } };
  const fail = () => { S.timedOut = true; clearTimeout(timer); schedule(); };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); done(snap); schedule(); }, fail));
  db.doc("site/config").onSnapshot(snap => { S.config = snap.exists ? snap.data() : {}; done(snap); schedule(); }, fail);
  if (canEdit) db.collection("inquiries").onSnapshot(snap => { S.inquiries = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, () => {});
})();
})();
</script>
