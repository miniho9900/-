<script>window.TRIZN_API = "api.php"; window.TRIZN_MEDIA_BASE = "uploads/"; window.TRIZN_DEMO_SEED = [{"path": "business/b1", "data": {"body": "", "btnLabel": "", "btnUrl": "", "content": "## WHY | 네트워크 운영관리, 왜 어려워지고 있을까요\n### 네트워크 운영관리 복잡도와 비용 지속증가\n- 네트워크 장비 급증\n### 네트워크 운영관리 전문가 급속히 감소\n- 국내외 전반적 인력감소\n### 기업 자체 운영관리 어려움 증가\n- 네트워크 전문지식 부재\n\n## TARGET | 자체 네트워크 운영관리가 필요한 곳\n### 리조트 & 관광지\n### 중소기업\n### 빌딩 & 쇼핑몰\n### 초·중·고등학교\n### MSO & 지자체\n### 체인 & 자영업소\n### 호텔 & 오피스텔\n\n## OUR GOAL | 트리즈엔이 하려는 일\n> 토탈 위생 서비스를 제공하는 세스코처럼, 토탈 보안 서비스를 제공하는 세콤처럼, **토탈 네트워크 서비스**를 제공하는 것\n고객의 복잡하고 다양한 환경에 맞춰 유무선 네트워크 설치부터 운영, 관리 및 맞춤형 컨설팅과 자동화까지 책임지는 솔루션 개발과 서비스를 제공하겠습니다.", "detailImageId": "d918a263d2517ab2ffabf65b9cb57dca.jpg", "en": "Network Consulting", "eyebrow": "고객 맞춤형", "imageId": "07910d1245f365f300978abef5987c92.jpg", "lead": "고객의 복잡하고 다양한 환경에 맞춰 유무선 네트워크 **설치부터 운영, 관리 및 맞춤형 컨설팅과 자동화까지** 책임지는 솔루션 개발과 서비스를 제공하겠습니다.", "order": 0, "summary": "고객의 복잡하고 다양한 환경에 맞춰 유무선 네트워크 설치부터 운영, 관리까지", "title": "네트워크 컨설팅 및 솔루션 개발", "updatedAt": "2026-11-13", "visible": true, "title_en": "Network Consulting & Solution Development", "eyebrow_en": "Tailored for you", "summary_en": "From wired and wireless network installation to operation and management, tailored to complex environments", "lead_en": "Tailored to each customer's complex and diverse environment, we develop solutions and deliver services that take responsibility for **everything from installation to operation, management, custom consulting and automation** of wired and wireless networks.", "content_en": "## WHY | Why network operations are getting harder\n### Growing complexity and cost of network operations\n- Rapid growth in network equipment\n### A shrinking pool of network operations experts\n- Workforce decline at home and abroad\n### Organizations struggle to run networks themselves\n- Lack of in-house network expertise\n\n## TARGET | Who needs managed network operations\n### Resorts & tourist sites\n### SMBs\n### Buildings & shopping malls\n### K-12 schools\n### MSOs & local governments\n### Chains & small businesses\n### Hotels & officetels\n\n## OUR GOAL | What TrizN sets out to do\n> Just as Cesco provides total hygiene services and S-1 (SECOM) total security services, we provide **total network services**.\nTailored to each customer's complex and diverse environment, we develop solutions and deliver services that take responsibility for everything from installation to operation, management, custom consulting and automation of wired and wireless networks."}}, {"path": "business/b2", "data": {"body": "", "btnLabel": "", "btnUrl": "", "content": "## PROCESS | 서비스 제공 프로세스\n### 고객분석 및 컨설팅\n- 고객의 비즈니스 목적 및 IT 전략 이해\n- 네트워크 인프라 현황 진단 (Legacy 장비, 보안, 트래픽, 장애 이력 등)\n- 향후 확장성, 보안요구사항, 예산 등 파악\n- 서비스 수준 협약(SLA) 초안 마련\n### 네트워크 설계 및 계획 수립\n- 논리적 네트워크 설계 (VLAN, IP 계획, 서브넷팅 등)\n- 물리적 설계 (장비 위치, 케이블 경로 등)\n- 고가용성, 이중화 구성 (예: STP, LACP, HSRP, VRRP 등)\n- 보안정책 설계 (ACL, 방화벽, IDS/IPS 등)\n### 시공 및 장치 설치\n- 케이블링 및 배선 공사 (구내통신, UTP, 광케이블 등)\n- 네트워크 장비 설치 (라우터, 스위치, 무선 AP, 방화벽 등)\n- 전원 및 난방 (UPS 연동, 랙 구성 등)\n- 장애 대비 이중화 구성 및 적용\n### 네트워크 설정 및 테스트\n- 네트워크 구성 작업 실시 (VLAN, 라우팅, QoS, 보안 설정 등)\n- 성능 테스트 (트레이스, PING, 대역폭 측정, 로드 테스트 등)\n- 보안성 점검 (포트 스캐닝, 침투 테스트 등)\n- 사용자 인증 및 접근 제어 설정\n### 교육 및 이관\n- 고객 담당자 교육 (운영/관리 지침)\n- 네트워크 구성도 및 설정 문서 제공\n- 관리시스템 연동 (예: NMS, Syslog, SNMP)\n- 구성 백업 및 초기화 이미지 전달\n### 유지보수 및 기술지원\n- 24/7 모니터링 또는 정기 점검\n- 원격 및 현장 기술지원 및 장애 대응 체계 (SLA 기준)\n- 정기 점검 및 펌웨어, 시스템 업데이트, 보안 패치 제공\n- 장애 대응 프로토콜\n- 기술지원 Help Desk 운영\n\n## SERVICE FEATURES | 서비스 특장점\n### 업무 효율성 향상\n효율적이고 안정적인 네트워크 환경 구현을 통해 업무의 생산성을 높입니다.\n### 네트워크 보안성 강화\n네트워크 보안을 강화하여 데이터 유출을 미연에 방지하고, 해킹 공격을 차단하여 시스템을 보호합니다.\n### 비용절감\n불필요한 네트워크 장비 및 인프라 도입을 사전에 방지함으로 IT 투자 업무 프로세스를 효율화하고, 비용 절감에 기여할 수 있습니다.\n### 사용자 경험\n높은 대역폭과 빠른 전송 속도 등 고성능의 안정적인 네트워크 서비스 제공을 통해 사용자의 만족도를 높입니다.\n\n## CASE | 적용 모델 예시\n### 학교\n- 사용량 변화, 관리 인력 부족\n- 클라우드 기반 컨트롤러, 자동화\n### 사무실\n- 업무 애플리케이션 중심\n- VLAN 분리, QoS 기반 정책\n### 공장\n- 넓은 영역, 실시간성\n- IoT 연동, Wi-Fi, Mesh, 산업용 스위치 등\n### 병원\n- 고신뢰성, 보안\n- 이중화 구성, 의료정보 보안 설계 등", "detailImageId": null, "en": "Design & Construction", "eyebrow": "고객 맞춤형", "imageId": "16ed5483b021c7b2c47ec193ffa36c42.jpg", "lead": "고객의 **특정 요구사항**과 업무 환경에 맞춰 **네트워크를 설계ㆍ구축ㆍ운영하는 서비스**를 제공합니다.", "order": 10, "summary": "설계부터 장비 구축, 시공까지 원스톱으로 수행", "title": "네트워크 시공 및 구축", "updatedAt": "2026-11-13", "visible": true, "title_en": "Network Design, Construction & Deployment", "eyebrow_en": "Tailored for you", "summary_en": "One-stop service from design to equipment deployment and construction", "lead_en": "We design, build and operate networks around each customer's **specific requirements** and work environment — **a complete network delivery service**.", "content_en": "## PROCESS | Service process\n### Customer analysis & consulting\n- Understand business goals and IT strategy\n- Assess current infrastructure (legacy equipment, security, traffic, incident history)\n- Identify scalability, security requirements and budget\n- Draft a service level agreement (SLA)\n### Network design & planning\n- Logical design (VLANs, IP plan, subnetting)\n- Physical design (equipment placement, cable routes)\n- High availability and redundancy (e.g. STP, LACP, HSRP, VRRP)\n- Security policy design (ACL, firewall, IDS/IPS)\n### Construction & installation\n- Cabling and wiring (premises, UTP, fiber)\n- Equipment installation (routers, switches, wireless APs, firewalls)\n- Power and cooling (UPS integration, rack configuration)\n- Redundancy for fault tolerance\n### Configuration & testing\n- Network configuration (VLAN, routing, QoS, security)\n- Performance tests (trace, ping, bandwidth, load tests)\n- Security checks (port scanning, penetration tests)\n- User authentication and access control\n### Training & handover\n- Training for customer staff (operation and management guides)\n- Network diagrams and configuration documents\n- Management system integration (e.g. NMS, Syslog, SNMP)\n- Configuration backups and recovery images\n### Maintenance & technical support\n- 24/7 monitoring or regular inspections\n- Remote and on-site support with SLA-based incident response\n- Regular checks, firmware/system updates and security patches\n- Incident response protocol\n- Technical support help desk\n\n## SERVICE FEATURES | Service highlights\n### Higher productivity\nAn efficient, stable network environment raises business productivity.\n### Stronger network security\nHardened security prevents data leaks and blocks hacking attempts to protect your systems.\n### Lower costs\nAvoiding unnecessary equipment and infrastructure streamlines IT investment and cuts costs.\n### Better user experience\nHigh bandwidth, fast transfer and stable performance raise user satisfaction.\n\n## CASE | Example deployments\n### Schools\n- Changing usage, limited IT staff\n- Cloud-based controllers, automation\n### Offices\n- Business application focus\n- VLAN segmentation, QoS-based policies\n### Factories\n- Large areas, real-time requirements\n- IoT integration, Wi-Fi, mesh, industrial switches\n### Hospitals\n- High reliability and security\n- Redundancy, medical information security design"}}, {"path": "business/b3", "data": {"body": "지능형 컨트롤러 기반 네트워크 서비스 구성도", "btnLabel": "", "btnUrl": "", "content": "## SERVICES | 서비스 제공 내역\n### 첨단 통합 운영관제 서비스\n- 인공지능 기반의 지능형 자동화 운영관제 솔루션을 통해 네트워크 및 운영장비의 성능, 보안, 트래픽 분석 등을 실시간 모니터링(상시)하고 통합 관제하는 서비스\n- 원격 장애 관리와 오프라인 출동을 통한 신속한 장애처리 서비스 제공\n- ※ 고객 환경에 따라 전문인력 상주 서비스 제공 가능\n### 네트워크 구독 서비스\n- 네트워크 구독 서비스를 통해 비용 부담 없이 고객환경에 필요한 모든 네트워크 솔루션을 렌탈하여 구축 및 운영관리까지 토탈 네트워크 서비스를 제공합니다.\n### Total 네트워크 솔루션 제공\n- Total 네트워크 솔루션 제공 서비스에 특화된 전문가 인력을 바탕으로 한 전국적인 유지보수 및 24시간 실시간 네트워크 감시 체계 서비스 제공\n- 전문가의 진단을 통해 최적의 성능, 장애예방, 효율적 운영관리 등을 모두 고려하여 고객 환경에 최적화된 네트워크를 설계부터 구축, 운영관리 및 맞춤형 자동화 솔루션 개발까지 제공\n\n## PROCESS | 서비스 제공 프로세스\n### 맞춤 컨설팅 서비스 제공\n- 고객사의 네트워크 현황(환경 및 구성 등)을 조사ㆍ분석\n- 맞춤 컨설팅을 통한 도입·적용 가능 서비스 모델 제시\n### 서비스 신청 및 약정\n- 맞춤 컨설팅 결과 도입·적용하고자 하는 서비스 모델 선택\n- 네트워크 구독 서비스 신청 및 계약서 작성\n### 서비스 제공\n- 신청된 서비스 모델 구축 일정 협의\n- 고객사 구축 실시\n### 서비스 비용 정산\n- 구축 완료 후 서비스 제공에 따른 이용료 과금\n### 서비스 해지\n- 서비스 제공 해지 신청\n- 서비스 해지 및 종료\n\n## SERVICE FEATURES | 서비스 특장점\n### 초기 구축 비용 및 운영관리비 절감\n- 월 임대료 납부 방식으로 저렴한 투자비용으로 네트워크 초기 구축 가능\n- 네트워크 구독 서비스를 통해 유지보수비, 장비구매비, 인건비 등 운영관리비 대폭 절감\n### 실시간 모니터링 서비스 제공\n- 고객사 내부 네트워크 환경을 통합적으로 24시간 365일 무중단 관제 서비스를 제공함으로써 안심하고 안정적으로 업무를 수행할 수 있는 환경 제공\n- 통합관제 자체 모니터링이 가능한 사용자 지향 관제 솔루션 제공\n### 효율적 장애복구ㆍOne Stop 서비스 제공\n- 지능형 컨트롤러를 통해 장비의 장애 및 24시간 손쉬운 모니터링 및 신속한 장애대응 가능\n- 네트워크 운영ㆍ관리부터 교육 및 기술지원까지 Total One Stop 서비스 제공\n### 서비스 안정성·연속성 제공\n- 공인 인증 및 BMT(Benchmark Test)를 통과한 신뢰성 있는 제품 사용을 통한 높은 서비스 안정성 제공\n- 네트워크 장비 파손 및 불량 시 최신 기술을 적용한 장비 교체로 서비스 연속성 확보\n\n## CASE | 서비스 적용 분야\n### 중소기업\n### MSO·지자체\n### 병원\n### 초·중·고등학교\n### 대학 캠퍼스\n### 호텔·오피스텔\n### 빌딩·쇼핑몰\n### 체인·자영업소\n### 리조트·관광지", "detailImageId": "d6cf3b9f417aef72f41b7530aee89745.png", "en": "Lease & Maintenance", "eyebrow": "고객 맞춤형", "imageId": "573de8004fd61a36a1df81de91c0ff9b.jpg", "lead": "고객의 **다양한 IT 인프라 환경**과 이용현황을 진단하여, **최적의 맞춤형 네트워크 솔루션 서비스**를 제공합니다.", "order": 20, "summary": "임대형 서비스로 초기 투자 부담을 줄이고 서비스 품질을 보장", "title": "네트워크 솔루션 임대 및 유지보수", "updatedAt": "2026-11-13", "visible": true, "title_en": "Network Solution Leasing & Maintenance", "eyebrow_en": "Tailored for you", "summary_en": "Subscription service that lowers upfront investment while guaranteeing service quality", "lead_en": "We assess each customer's **IT infrastructure and usage** and deliver **the best-fit network solution as a service**.", "body_en": "Network service architecture based on intelligent controllers", "content_en": "## SERVICES | What we provide\n### Advanced integrated operations monitoring\n- AI-based intelligent, automated monitoring of network and equipment performance, security and traffic — around the clock\n- Fast incident handling through remote fault management and on-site dispatch\n- ※ On-site engineers available depending on the customer environment\n### Network subscription ": "Contact"}}, {"path": "pillars/v1", "data": {"body": "트리즈엔은 최고의 제품과 서비스 품질을 기반으로\n“고객만족을 최우선으로 하는 기업”이라는 슬로건 아래 지능형 자동화 초연결 네트워크를 목표로 지능형 네트워크를 컨설팅 및 구축을 위해 최선의 노력을 다하고 있습니다.", "en": "Customer First", "order": 0, "title": "고객만족을 최우선으로 하는 기업", "updatedAt": "2026-11-13", "visible": true, "title_en": "Customer satisfaction comes first", "body_en": "Built on the highest product and service quality, and guided by our motto \"Customer satisfaction comes first,\" TrizN does its utmost to consult on and build intelligent networks, aiming for intelligent, automated, hyper-connected networks."}}, {"path": "pillars/v2", "data": {"body": "지능형 유무선 통합 SDN 솔루션 개발 및 운용기술을 기반으로 통신서비스에 필요한 멀티밴더의 장비 및 단말을 구축하고 통합 운용시스템을 제공합니다.", "en": "ICT Total Solution", "order": 10, "title": "지능형 ICT 토탈 솔루션을 제공하는 전문기업", "updatedAt": "2026-11-13", "visible": true, "title_en": "A specialist in intelligent ICT total solutions", "body_en": "Based on our development and operation of intelligent wired/wireless integrated SDN solutions, we build multi-vendor equipment and devices for communication services and provide an integrated operating system."}}, {"path": "pillars/v3", "data": {"body": "고객의 수요에 맞는 서비스가 아닌\n선제적으로 미래지향적 맞춤 가치를 지원하며,\n고객과 함께 미래를 준비하는 기업입니다.\n고객과 함께 성장하여 더 나은 미래를 준비합니다.", "en": "Future Together", "order": 20, "title": "고객과 함께 미래를 준비하는 기업", "updatedAt": "2026-11-13", "visible": true, "title_en": "Preparing the future with our customers", "body_en": "Rather than simply meeting today's demand,\nwe proactively deliver forward-looking, tailored value\nand prepare for the future together with our customers.\nWe grow with our customers toward a better tomorrow."}}, {"path": "popups/u1", "data": {"body": "새 홈페이지에서 트리즈엔의 네트워크 서비스와\nSDN 솔루션을 만나보세요.", "btnLabel": "공지 보기", "btnRoute": "news", "end": "", "eyebrow": "NOTICE", "imageId": null, "order": 0, "start": "2026-11-12", "title": "홈페이지\n리뉴얼 오픈", "updatedAt": "2026-11-12", "visible": false, "title_en": "Our new\nwebsite is live", "body_en": <script>
/* 트리즈엔 관리자 체험판 — 브라우저 안의 가상 서버
   server/api.php 와 같은 요청(bootstrap, login, write, upload, users …)을 같은 규칙으로 처리합니다.
   데이터는 이 브라우저의 localStorage 에만 저장되는 시험용입니다. */
(function () {
  "use strict";
  var KEY = "trizn-demo-v2", SKEY = "trizn-demo-session-v2";
  var SECTIONS = ["site","menus","slides","popups","business","products","works","posts","inquiries","pillars","facts","history","partners"];
  var COLS = ["menus","slides","popups","business","products","works","posts","partners","history","pillars","facts","site"];
  var MAX = 512 * 1048576;
  var mem = null, sess = null;

  function now() { return new Date().toISOString(); }
  function load() {
    if (mem) return mem;
    try { var raw = localStorage.getItem(KEY); if (raw) mem = JSON.parse(raw); } catch (e) {}
    if (!mem || !mem.docs) mem = null;
    return mem;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} }
  function session() {
    if (sess) return sess;
    try { sess = JSON.parse(sessionStorage.getItem(SKEY) || "null"); } catch (e) {}
    if (!sess) sess = { csrf: rand(16), uid: null };
    return sess;
  }
  function saveSess() { try { sessionStorage.setItem(SKEY, JSON.stringify(sess)); } catch (e) {} }
  function rand(n) { var a = new Uint8Array(n); crypto.getRandomValues(a); return Array.from(a, function (b) { return b.toString(16).padStart(2, "0"); }).join(""); }
  async function hash(pw, salt) {
    var d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(salt + ":" + pw));
    return salt + "$" + Array.from(new Uint8Array(d), function (b) { return b.toString(16).padStart(2, "0"); }).join("");
  }
  async function verify(pw, stored) { var salt = String(stored).split("$")[0]; return (await hash(pw, salt)) === stored; }
  function validPw(pw) {
    if (pw.length < 8) return "비밀번호는 8자 이상이어야 합니다.";
    if (!/[A-Za-z]/.test(pw) || !/\d/.test(pw)) return "비밀번호에 영문과 숫자를 함께 넣어 주세요.";
    return null;
  }
  async function init() {
    if (load()) return mem;
    var seed = window.TRIZN_DEMO_SEED || [];
    mem = { docs: {}, users: [], inquiries: [], attempts: [] };
    seed.forEach(function (d) { var p = d.path.split("/"); (mem.docs[p[0]] = mem.docs[p[0]] || {})[p[1]] = d.data; });
    mem.users.push({ id: 1, login: "admin", name: "최고관리자", pass: await hash("Trizn2026x", rand(8)), role: "super", perms: [], active: true, created: now(), last: null });
    mem.users.push({ id: 2, login: "editor1", name: "홍보담당", pass: await hash("Editor2026", rand(8)), role: "sub", perms: ["posts", "popups"], active: true, created: now(), last: null });
    save();
    return mem;
  }
  function me() { var s = session(); return s.uid ? mem.users.find(function (u) { return u.id === s.uid && u.active; }) || null : null; }
  function permsOf(u) { return u.role === "super" ? ["*"] : u.perms || []; }
  function can(u, sec) { if (!u) return false; var p = permsOf(u); return p.indexOf("*") >= 0 || p.indexOf(sec) >= 0; }
  function pub(u) { return { id: u.login, name: u.name, role: u.role, perms: permsOf(u), active: !!u.active, lastLogin: u.last, createdAt: u.created }; }
  function isList(v) { return Array.isArray(v); }
  function isObj(v) { return v && typeof v === "object" && !Array.isArray(v); }
  function merge(a, b) { var o = Object.assign({}, a); Object.keys(b).forEach(function (k) { o[k] = isObj(b[k]) && isObj(a[k]) ? merge(a[k], b[k]) : b[k]; }); return o; }
  function Fail(code, msg, http) { this.code = code; this.msg = msg; this.http = http || 400; }
  function fail(code, msg, http) { throw new Fail(code, msg, http); }
  var supers = function (exceptId) { return mem.users.filter(function (u) { return u.role === "super" && u.active && u.id !== exceptId; }).length; };

  async function handle(action, method, body, form, headers) {
    await init();
    var s = session(), u = me(), isPost = method === "POST";
    if (isPost && headers["X-CSRF"] !== s.csrf) fail("csrf", "페이지를 새로고침한 뒤 다시 시도하세요.", 403);
    var need = function (sec) { if (!u) fail("auth", "로그인이 필요합니다.", 401); if (sec && !can(u, sec)) fail("forbidden", "이 메뉴를 수정할 권한이 없습니다.", 403); };
    var superOnly = function () { if (!u || u.role !== "super") fail("forbidden", "최고관리자만 할 수 있습니다.", 403); };
    switch (action) {
    case "bootstrap": {
      var data = {};
      COLS.forEach(function (c) { data[c] = Object.keys(mem.docs[c] || {}).map(function (id) { return { id: id, data: mem.docs[c][id] }; }); });
      if (u) data.drafts = Object.keys(mem.docs.drafts || {}).filter(function (id) { return can(u, id.split("__")[0]); }).map(function (id) { return { id: id, data: mem.docs.drafts[id] }; });
      if (can(u, "inquiries")) data.inquiries = [{ id: "all", data: { items: mem.inquiries.slice().reverse() } }];
      return { ok: true, data: data, me: u ? pub(u) : null, csrf: s.csrf, maxUpload: MAX };
    }
    case "login": {
      var t = Date.now() - 900000;
      mem.attempts = mem.attempts.filter(function (a) { return a.at > t; });
      if (mem.attempts.filter(function (a) { return a.login === body.id; }).length >= 5) fail("too_many", "로그인 시도가 많습니다. 15분 뒤 다시 시도하세요.", 429);
      var x = mem.users.find(function (v) { return v.login === String(body.id || "").trim(); });
      if (!x || !x.active || !(await verify(String(body.pw || ""), x.pass))) { mem.attempts.push({ login: body.id, at: Date.now() }); save(); fail("invalid", "아이디 또는 비밀번호가 맞지 않습니다.", 401); }
      s.uid = x.id; s.csrf = rand(16); saveSess(); x.last = now(); mem.attempts = mem.attempts.filter(function (a) { return a.login !== x.login; }); save();
      return { ok: true };
    }
    case "logout": sess = { csrf: rand(16), uid: null }; saveSess(); return { ok: true };
    case "write": {
      var col = String(body.col || ""), id = String(body.id || ""), op = body.op;
      if (!/^[A-Za-z0-9_-]{1,80}$/.test(id)) fail("invalid_argument", "잘못된 문서 번호입니다.");
      if (col === "drafts") { var tg = id.split("__")[0]; if (COLS.indexOf(tg) < 0) fail("invalid_argument", "잘못된 반영 대기 항목입니다."); need(tg); }
      else { if (COLS.indexOf(col) < 0) fail("invalid_argument", "알 수 없는 항목입니다."); need(col); }
      var bag = mem.docs[col] = mem.docs[col] || {};
      if (op === "delete") { delete bag[id]; save(); return { ok: true }; }
      var d = body.data; if (!isObj(d)) fail("invalid_argument", "저장할 내용이 올바르지 않습니다.");
      if (op === "update") { if (!bag[id]) fail("invalid_argument", "이미 삭제된 항목입니다."); d = merge(bag[id], d); }
      else if (op !== "set") fail("invalid_argument", "잘못된 요청입니다.");
      bag[id] = d; save();
      return { ok: true, data: d };
    }
    case "upload": {
      need(null);
      if (!SECTIONS.some(function (sec) { return can(u, sec); })) fail("forbidden", "업로드 권한이 없습니다.", 403);
      var f = form && form.get("file");
      if (!f) fail("invalid_argument", "파일을 받지 못했습니다.");
      var ext = (String(f.name).split(".").pop() || "").toLowerCase();
      if (["jpg","jpeg","png","gif","webp","mp4","webm","mov","m4v","pdf","csv","txt"].indexOf(ext) < 0) fail("invalid_argument", "올릴 수 없는 파일 형식입니다. (이미지, MP4/WEBM 영상, PDF만 가능)");
      if (f.size > MAX) fail("quota_exceeded", "파일이 업로드 한도보다 큽니다.", 413);
      var url = URL.createObjectURL(f);
      return { ok: true, id: url, url: url, size: f.size, type: f.type };
    }
    case "inquiry": {
      if (String(body.website || "").trim()) return { ok: true };
      var item = {};
      [["name",60],["contact",80],["type",30],["body",2000]].forEach(function (p) { var v = String(body[p[0]] || "").trim(); if (!v && p[0] !== "type") fail("invalid_argument", "필수 항목을 모두 입력해 주세요."); item[p[0]] = v.slice(0, p[1]); });
      item.id = "q" + Date.now(); item.at = now(); mem.inquiries.push(item); save();

/* ---------- hero ---------- */
.hero{position:relative;height:clamp(600px,88vh,880px);color:#fff;overflow:hidden;background:var(--ink)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);pointer-events:none}
.slide.on{opacity:1;pointer-events:auto}
.slide .vis{position:absolute;inset:0}
.slide .vis img,.slide .ph{transform:scale(1.08);transition:transform 7s linear}
.slide.on .vis img,.slide.on .ph{transform:scale(1)}
.slide::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(11,10,69,.92) 0%,rgba(11,10,69,.55) 55%,rgba(11,10,69,.15))}
.hero-copy{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;justify-content:center}
.hero-copy .wrap{width:100%}
.hero h1{font-family:var(--f-display);font-weight:300;font-size:clamp(40px,6.4vw,92px);line-height:1.04;letter-spacing:-.035em;max-width:14ch;margin:22px 0 28px}

.hero .ctas{display:flex;gap:12px;margin-top:44px;flex-wrap:wrap}
.slide.on .anim{animation:rise .9s var(--ease) both}
.slide.on .anim.d2{animation-delay:.12s}.slide.on .anim.d3{animation-delay:.24s}.slide.on .anim.d4{animation-delay:.36s}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.hero-ctrl{position:absolute;z-index:3;left:0;right:0;bottom:56px}
.hero-ctrl .wrap{display:flex;align-items:center;gap:20px}
.hero-ctrl .cur{font-family:var(--f-display);font-weight:600;font-size:14px}
.hero-ctrl .tot{font-family:var(--f-display);font-size:14px;opacity:.5}
.bar{width:min(240px,30vw);height:2px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;background:var(--violet-soft);transform-origin:left;transform:scaleX(0)}
.bar i.run{animation:prog var(--dur,6s) linear forwards}
@keyframes prog{to{transform:scaleX(1)}}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:none;color:#fff;display:grid;place-items:center;transition:background .25s,border-color .25s}

.scroll-cue i::after{content:"";position:absolute;inset:0;background:#fff;animation:cue 2.2s var(--ease) infinite}
@keyframes cue{from{transform:translateX(-100%)}to{transform:translateX(100%)}}

.biz-card .in{position:absolute;z-index:2;left:28px;right:14px;bottom:36px}
.biz-card .no{font-family:var(--f-display);font-size:13px;letter-spacing:.2em;color:var(--violet-soft)}
.biz-card h3{font-family:var(--f-display);font-size:clamp(18px,1.45vw,26px);font-weight:600;margin:10px 0 8px;line-height:1.2}
.biz-card .ko{font-size:15px;color:var(--on-dark-2)}
.biz-card .desc{max-height:0;opacity:0;overflow:hidden;transition:max-height .6s var(--ease),opacity .4s;font-size:14px;color:var(--on-dark-2);max-width:36ch}
.biz-card .line{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--violet);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease);z-index:3}
.biz:hover .biz-card{flex:1}
.biz .biz-card:hover,.biz:not(:hover) .biz-card:first-child{flex:1.9}
.biz .biz-card:hover .desc,.biz:not(:hover) .biz-card:first-child .desc{max-height:120px;opacity:1;margin-top:14px}
.biz .biz-card:hover .line,.biz:not(:hover) .biz-card:first-child .line{transform:scaleX(1)}

/* product scroller */
.scroller-hd{display:flex;align-items:center;gap:14px}
.scroller-hd .cnt{font-family:var(--f-display);font-size:14px;color:var(--muted);min-width:56px;text-align:right}
.circ-dk{width:52px;height:52px;border-radius:50%;border:1px solid var(--line-2);background:var(--paper);display:grid;place-items:center;color:var(--ink);transition:background .25s,color .25s,border-color .25s}
.circ-dk:hover{background:var(--ink);color:#fff;border-color:var(--ink)}
.track{display:flex;gap:24px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:none;padding-left:max(24px,calc((100vw - var(--wrap)) / 2));padding-right:max(24px,var(--gut-r));scroll-padding-left:max(24px,calc((100vw - var(--wrap)) / 2))}
.track::-webkit-scrollbar{display:none}
.p-card{flex:0 0 clamp(280px,32vw,420px);scroll-snap-align:start;background:var(--paper);display:flex;flex-direction:column;transition:transform .4s var(--ease),box-shadow .4s}
.p-card:hover{transform:translateY(-6px);box-shadow:0 24px 48px -24px rgba(11,10,69,.35)}
.p-card .vis{aspect-ratio:4/3;max-width:100%}
.p-card .vis img{transition:transform .8s var(--ease)}
.p-card:hover .vis img{transform:scale(1.05)}
.p-card .b{padding:28px 30px 32px;display:flex;flex-direction:column;gap:10px;flex:1}
.p-card h3{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--ink)}
.p-card p{color:var(--muted);font-size:14px}
.p-card .go{margin-top:auto;padding-top:12px;font-size:14px;font-weight:500;color:var(--ink);display:flex;align-items:center;gap:8px}

/* marquee */
.marquee{overflow:hidden;border-block:1px solid var(--line);padding-block:40px;background:var(--paper)}
.mq-row{display:flex;width:max-content;animation:mq 38s linear infinite}
.mq-row span{font-family:var(--f-display);font-weight:700;font-size:clamp(56px,8vw,112px);line-height:1;letter-spacing:-.03em;color:var(--ink);padding-right:.5em;white-space:nowrap}
.mq-row span.o{color:transparent;-webkit-text-stroke:1px rgba(11,10,69,.35)}
.mq-row span.d{color:var(--violet)}
@keyframes mq{to{transform:translateX(-50%)}}

/* news */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:9px 20px;font-size:14px;color:var(--muted);transition:all .25s}
.tab:hover{border-color:var(--ink);color:var(--ink)}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.news-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.1fr);gap:32px}
.n-card{display:flex;flex-direction:column;gap:18px}
.n-card .vis{aspect-ratio:3/2;max-width:100%}
.n-card .vis img{transition:transform .8s var(--ease)}
.n-card:hover .vis img{transform:scale(1.05)}
.n-card h3{font-size:19px;font-weight:500;line-height:1.5;transition:color .2s}
.n-card:hover h3{color:var(--violet)}
.meta{font-size:13px;color:var(--muted);font-family:var(--f-display)}
.badge{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;background:var(--lilac);color:var(--violet);letter-spacing:0;white-space:nowrap}
.badge.ink{background:var(--ink);color:#fff}
.badge.new{background:var(--violet);color:#fff;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}
.badge.off{background:var(--mist);color:var(--muted);border:1px solid var(--line)}
.n-list{border-top:2px solid var(--ink)}
.n-list .hd2{display:flex;justify-content:space-between;align-items:center;padding:0 0 16px;margin-top:-46px}
.n-list a.r{display:flex;align-items:center;gap:12px;padding:19px 0;border-bottom:1px solid var(--line);transition:padding .25s var(--ease)}
.n-list a.r:hover{padding-left:8px}
.n-list a.r .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-list a.r:hover .t{color:var(--violet)}

/* partners */
.logos{overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
.logos .row{display:flex;gap:20px;width:max-content;animation:mq 30s linear infinite}
.logo-chip{width:200px;height:88px;flex:none;background:var(--paper);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-display);font-weight:600;font-size:15px;color:var(--muted);letter-spacing:.06em;padding:16px}
.logo-chip img{max-height:44px;max-width:150px;object-fit:contain;filter:grayscale(1);opacity:.75;transition:all .3s}
.logo-chip:hover img{filter:none;opacity:1}

/* CTA */
.cta{position:relative;overflow:hidden}
.cta .wrap{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap;position:relative;z-index:2;padding-block:110px}
.cta h2{font-size:clamp(28px,3.2vw,42px);font-weight:700;margin:16px 0 12px;max-width:22ch}
.cta p{color:var(--on-dark-2)}
.cta .ctas{display:flex;gap:12px;flex-wrap:wrap}
.cta::before{content:"";position:absolute;right:-8%;top:-30%;width:560px;max-width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(82,48,194,.55),transparent 65%)}

/* footer */
.ft{background:#07062F;color:var(--on-dark-2);font-size:14px}
.ft-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:56px 72px;padding-block:72px 56px;align-items:start}
.ft-logo{height:28px;width:auto;display:block;margin-bottom:28px}
.ft-name{color:#fff;font-size:15px;font-weight:500;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.ft-name span{color:var(--on-dark-2);font-weight:400;padding-left:14px;border-left:1px solid var(--on-dark-line)}
.ft-info{display:grid;grid-template-columns:52px minmax(0,1fr);gap:8px 16px;margin:0;line-height:1.75}
.ft-info dt{color:rgba(255,255,255,.88);font-weight:500;white-space:nowrap}
.ft-info dd{margin:0;min-width:0}
.ft-info dd span{display:inline-block;margin-right:22px;white-space:nowrap}
.ft-info dd span b{font-weight:400;color:rgba(255,255,255,.5);margin-right:6px}
.ft-cols{display:flex;gap:48px;flex-wrap:wrap}
.ft-cols h4{color:#fff;font-size:14px;font-weight:500;margin-bottom:14px}
.ft-cols a{display:block;line-height:2.2;transition:color .2s}
.ft-cols a:hover{color:#fff}
.ft-fam{display:inline-flex!important;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--on-dark-line);line-height:1!important;transition:border-color .25s,background .25s}
.ft-fam img{height:30px;width:auto;display:block}
.ft-fam:hover{border-color:var(--violet-soft);background:rgba(255,255,255,.04)}
.ft-fam svg{color:rgba(255,255,255,.7);flex:none}
@media (max-width:1080px){.ft-top{grid-template-columns:minmax(0,1fr)}}
@media (max-width:520px){.ft-info{grid-template-columns:minmax(0,1fr);gap:2px}.ft-info dd{margin-bottom:10px}.ft-cols{gap:32px}}
.ft .bot{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid var(--on-dark-line);padding-block:24px 32px;font-size:13px}
.ft .bot a{margin-left:20px}
.ft .bot a:first-child{margin-left:0;color:#fff}

/* sub pages */
.sub-vis{position:relative;height:440px;color:#fff;display:flex;align-items:flex-end;overflow:hidden}
.sub-vis .vis{position:absolute;inset:0}
.sub-vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,10,69,.55),rgba(11,10,69,.85))}
.sub-vis .wrap{position:relative;z-index:2;width:100%;padding-bottom:64px}
.sub-vis h1{font-size:clamp(34px,4.6vw,60px);font-weight:700;margin:14px 0 12px}
.crumb{font-size:13px;color:var(--on-dark-2);font-family:var(--f-display);letter-spacing:.04em}
.lnb{border-bottom:1px solid var(--line);background:var(--paper);position:sticky;top:calc(72px + env(safe-area-inset-top,0px));z-index:20}
.lnb .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.lnb a,.lnb button{padding:22px 26px;font-size:15px;color:var(--muted);border:0;background:none;border-bottom:2px solid transparent;white-space:nowrap}
.lnb .on{color:var(--ink);font-weight:500;border-bottom-color:var(--ink)}

.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px);align-items:start}
.about-grid .vis{aspect-ratio:4/5;max-width:100%}
.ceo-msg{font-size:17px;color:#38365A;white-space:pre-line;line-height:2}
.ceo-sign{margin-top:36px;font-size:15px;color:var(--muted)}
.ceo-sign b{font-size:20px;color:var(--ink);margin-left:10px}
.timeline{display:grid;gap:0;border-top:1px solid var(--line)}
.tl-row{display:grid;grid-template-columns:180px minmax(0,1fr);gap:24px;padding:28px 0;border-bottom:1px solid var(--line)}
.tl-row .y{font-family:var(--f-display);font-size:32px;font-weight:600;color:var(--ink);line-height:1.1}
.tl-row .t{white-space:pre-line;color:#38365A}
.loc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px}
.loc dl{margin:0;display:grid;grid-template-columns:100px minmax(0,1fr);gap:14px 20px}
.loc dt{color:var(--muted);font-size:14px}.loc dd{margin:0}
.map-ph{aspect-ratio:16/10;max-width:100%;background:var(--mist);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:14px;position:relative;overflow:hidden}
.map-ph::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 40px),repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 40px);opacity:.6}
.map-ph span{position:relative;background:var(--paper);padding:10px 16px;border:1px solid var(--line)}

.biz-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(32px,6vw,96px);align-items:center;padding-block:56px;border-bottom:1px solid var(--line)}
.biz-row:nth-child(even) .vis{order:2}
.biz-row .vis{aspect-ratio:4/3;max-width:100%}
.biz-row h3{font-family:var(--f-display);font-size:clamp(26px,3vw,38px);font-weight:600;color:var(--ink);margin:14px 0 6px}
.biz-row .ko{font-size:18px;font-weight:500;margin-bottom:20px}
.biz-row p{color:#4A4868;white-space:pre-line}

.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px 28px}
.w-card .vis{aspect-ratio:4/3;max-width:100%}
.w-card .vis::after{content:"";position:absolute;inset:0;background:rgba(82,48,194,.0);transition:background .4s}
.w-card:hover .vis::after{background:rgba(82,48,194,.25)}
.w-card .b{padding-top:18px;display:grid;gap:6px}
.w-card h3{font-size:18px;font-weight:500}

.board-tools{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.board-tools .total b{color:var(--violet)}
.search{display:flex}
.search input{border:1px solid var(--line-2);border-right:0;padding:12px 16px;width:min(320px,60vw);background:var(--paper);outline-offset:-2px}
.search button{border:0;background:var(--ink);color:#fff;width:48px;display:grid;place-items:center}
.board{width:100%;border-collapse:collapse;border-top:2px solid var(--ink)}
.board th{font-weight:500;font-size:14px;padding:18px 12px;background:var(--mist);border-bottom:1px solid var(--line)}
.board td{padding:22px 12px;border-bottom:1px solid var(--line);font-size:15px;text-align:center;color:var(--muted)}
.board td.t{text-align:left;color:var(--text)}
.board td.t a{display:inline-flex;align-items:center;gap:10px}
.board td.t a:hover span{color:var(--violet);text-decoration:underline;text-underline-offset:4px}
.board tr.pin td{background:#FAF9FE}
.board tr.pin td.t{font-weight:500;color:var(--ink)}
.pager{display:flex;justify-content:center;gap:6px;margin-top:40px}
.pager button{width:40px;height:40px;border:1px solid var(--line);background:var(--paper);font-family:var(--f-display);font-size:14px}
.pager button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.pager button:disabled{opacity:.35;cursor:default}
.empty{padding:72px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-2);background:var(--mist)}

.post-hd{border-top:2px solid var(--ink);border-bottom:1px solid var(--line);padding:36px 0}
.post-hd h1{font-size:clamp(24px,2.6vw,32px);font-weight:700;margin:14px 0}
.post-body{padding:48px 0 64px;font-size:17px;line-height:2;color:#2F2D4E;white-space:pre-line;border-bottom:1px solid var(--line);max-width:80ch}
.post-body .vis{margin-bottom:36px;aspect-ratio:16/9;max-width:100%}
.post-nav{border-bottom:1px solid var(--line)}
.post-nav a{display:flex;gap:24px;padding:20px 8px;border-bottom:1px solid var(--line);font-size:15px}
.post-nav a:last-child{border-bottom:0}
.post-nav a span:first-child{color:var(--muted);width:64px;flex:none}
.post-nav a:hover span:last-child{color:var(--violet)}

.contact-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(40px,6vw,96px)}
.c-info{display:grid;gap:28px;align-content:start}
.c-info .k{font-size:13px;color:var(--muted);margin-bottom:4px}
.c-info .v{font-size:20px;font-weight:500;color:var(--ink)}
.form{display:grid;gap:18px}
.form .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.field{display:grid;gap:8px}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{border:1px solid var(--line-2);background:var(--paper);padding:13px 14px;width:100%;border-radius:0;outline-offset:-2px}
.field textarea{min-height:160px;resize:vertical}
.note{font-size:13px;color:var(--muted)}

/* popups */
.pop-layer{position:fixed;inset:0;z-index:80;background:rgba(7,6,47,.6);display:flex;align-items:center;justify-content:center;gap:20px;padding:max(24px,env(safe-area-inset-top,0px)) var(--gut-r) 24px var(--gut);flex-wrap:wrap;overflow:auto;animation:fade .35s}
@keyframes fade{from{opacity:0}}
.pop{width:min(400px,100%);background:var(--paper);box-shadow:0 32px 64px -24px rgba(0,0,0,.5);animation:rise .5s var(--ease) both}
.pop .vis{aspect-ratio:10/9;max-width:100%;color:#fff}
.pop .vis::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(11,10,69,.85))}
.pop .pc{position:absolute;z-index:2;left:32px;right:32px;bottom:30px}
.pop .pc h3{font-size:26px;font-weight:700;margin:10px 0 8px;line-height:1.35;white-space:pre-line}
.pop .pc p{font-size:14px;color:var(--on-dark-2);white-space:pre-line}
.pop .act{padding:20px 24px}
.pop .act .btn{width:100%;justify-content:center}
.pop .foot{display:flex;justify-content:space-between;align-items:center;background:var(--mist);padding:12px 24px;font-size:13px}
.pop .foot label{display:flex;gap:8px;align-items:center;color:var(--muted);cursor:pointer}
.pop .foot button{border:0;background:none;font-weight:500}

.edit-fab{position:fixed;right:max(20px,env(safe-area-inset-right,0px));bottom:max(20px,env(safe-area-inset-bottom,0px));z-index:45;display:flex;align-items:center;gap:8px;background:var(--violet);color:#fff;padding:12px 18px;font-size:14px;font-weight:500;box-shadow:0 12px 30px -10px rgba(82,48,194,.7)}
.edit-fab:hover{background:var(--ink)}

.reveal.in{animation:rise .9s var(--ease) both}
.toast{position:fixed;left:50%;bottom:calc(max(28px,env(safe-area-inset-bottom,0px)) + 72px);transform:translateX(-50%);z-index:120;background:var(--ink);color:#fff;padding:12px 20px;font-size:14px;box-shadow:0 12px 30px -10px rgba(0,0,0,.4);animation:rise .35s var(--ease) both;max-width:calc(100vw - 32px)}
.toast.err{background:var(--danger)}
.notice-bar{background:var(--lilac);color:var(--ink);font-size:13px;text-align:center;padding:10px 16px}

/* ============ ADMIN ============ */
.adm{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh;background:var(--mist)}
.adm-side{background:var(--ink);color:#fff;position:sticky;top:0;height:100vh;overflow:auto;padding:28px 0 24px;display:flex;flex-direction:column}
.adm-side .brand{padding:0 28px 28px;border-bottom:1px solid var(--on-dark-line)}
.adm-side .brand img{height:24px;width:auto}
.adm-side .brand small{display:block;margin-top:10px;font-family:var(--f-display);letter-spacing:.2em;font-size:11px;color:var(--violet-soft)}
.adm-nav{padding:16px 12px;display:grid;gap:2px}
.adm-nav .grp{font-size:11px;letter-spacing:.16em;color:rgba(255,255,255,.4);padding:18px 16px 8px;font-family:var(--f-display)}
.adm-nav a{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;font-size:14px;color:var(--on-dark-2);border-radius:6px;transition:background .2s,color .2s}
.adm-nav a:hover{background:rgba(255,255,255,.06);color:#fff}
.adm-nav a.on{background:var(--violet);color:#fff}
.adm-nav a .c{font-family:var(--f-display);font-size:12px;opacity:.7}
.adm-side .bottom{margin-top:auto;padding:16px 28px 0;border-top:1px solid var(--on-dark-line);font-size:13px}
.adm-side .bottom a{display:flex;align-items:center;gap:8px;color:var(--on-dark-2);padding:8px 0}
.adm-side .bottom a:hover{color:#fff}
.adm-main{min-width:0;padding:0 0 80px}
.adm-top{position:sticky;top:0;z-index:20;background:rgba(246,245,251,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:18px 40px;display:flex;justify-content:space-between;align-items:center;gap:16px}
.adm-top h1{font-size:22px;font-weight:700;color:var(--ink)}
.adm-top .desc{font-size:13px;color:var(--muted);margin-top:2px}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--ok);background:#E8F5EE;padding:6px 12px;border-radius:999px;white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 1.8s infinite}
.live.off{color:var(--muted);background:var(--paper);border:1px solid var(--line)}.live.off i{background:var(--muted);animation:none}
@keyframes pulse{50%{opacity:.3}}
.adm-body{padding:32px 40px;display:grid;gap:24px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:10px}
.panel-hd{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel-hd h2{font-size:16px;font-weight:700;color:var(--ink)}
.panel-bd{padding:22px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:16px}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px 22px;display:grid;gap:4px;transition:border-color .2s}
.kpi:hover{border-color:var(--violet)}
.kpi .k{font-size:13px;color:var(--muted)}
.kpi .v{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--ink)}
.kpi .s{font-size:12px;color:var(--muted)}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.how div{background:var(--mist);border-radius:8px;padding:18px}
.how b{display:block;color:var(--ink);margin-bottom:6px;font-size:15px}
.how p{font-size:13px;color:var(--muted);line-height:1.7}

const TR_ATTR = /\b(placeholder|aria-label|title|alt)="([^"]*[\uAC00-\uD7A3][^"]*)"/g;
function trText(t){
  const k = t.trim(); if (!k || !/[\uAC00-\uD7A3]/.test(k)) return t;
  let v = DICT[k] ?? DICT[k.replace(/&amp;/g,"&")];
  if (v === undefined && k.includes(" › ")) { const parts = k.split(" › ").map(x => DICT[x.trim()] ?? x); if (parts.some((x,i) => x !== k.split(" › ")[i])) v = parts.join(" › "); }
  if (v === undefined){ let m;
    if ((m = k.match(/^전체 (\d+)건$/))) v = `${m[1]} posts`;
    else if ((m = k.match(/^대표이사 (.+)$/))) v = `CEO ${m[1]}`;
    else if ((m = k.match(/^(.+) 대표이사$/))) v = `${m[1]} CEO`;
    else if ((m = k.match(/^(.+) 구성도$/))) v = `${m[1]} diagram`;
    else if ((m = k.match(/^(.+) 사이트 바로가기 \(새 창\)$/))) v = `Visit ${m[1]} (new window)`;
  }
  return v === undefined ? t : t.replace(k, String(v).replace(/&(?!amp;|lt;|gt;|quot;|#)/g, "&amp;"));
}

}

/* ---- safe HTML ---- */
const OK_TAGS = new Set("p br b strong i em u s h2 h3 h4 ul ol li a img table thead tbody tr th td blockquote span div section hr figure figcaption small sup sub".split(" "));
const DROP_TAGS = new Set("script style iframe object embed link meta form input button textarea select noscript template svg math".split(" "));
const OK_STYLE = /^(color|background-color|text-align|font-weight|font-style|text-decoration|text-decoration-line)$/;
function sanitize(html){
  const doc = new DOMParser().parseFromString(`<div>${html||""}</div>`, "text/html");
  const walk = node => {
    [...node.childNodes].forEach(ch => {
      if (ch.nodeType === 8) { ch.remove(); return; }
      if (ch.nodeType !== 1) return;
      const tag = ch.tagName.toLowerCase();
      if (DROP_TAGS.has(tag)) { ch.remove(); return; }
      if (!OK_TAGS.has(tag)) { const f = doc.createDocumentFragment(); while (ch.firstChild) f.appendChild(ch.firstChild); walk(f); ch.replaceWith(f); return; }
      [...ch.attributes].forEach(a => {
        const n = a.name.toLowerCase(), v = a.value.trim();
        let keep = false;
        if (n==="href") keep = /^(https?:|mailto:|tel:|#|\/)/i.test(v);
        else if (n==="src") keep = tag==="img" && (/^(\/_blob\/|\/?uploads\/|blob:)/.test(v) || /^data:image\/(png|jpe?g|gif|webp);/i.test(v));
        else if (["alt","title","colspan","rowspan","target"].includes(n)) keep = true;
        else if (n==="class") keep = /^[\w\s-]*$/.test(v);
        else if (n==="style"){ const clean = v.split(";").map(x=>x.trim()).filter(x => { const [k,val=""] = x.split(":"); return k && OK_STYLE.test(k.trim().toLowerCase()) && !/url\(|expression|javascript/i.test(val); }).join("; "); if (clean){ ch.setAttribute("style", clean); } else ch.removeAttribute("style"); return; }
        if (!keep) ch.removeAttribute(a.name);
      });
      if (tag==="a"){ if (/^https?:/i.test(ch.getAttribute("href")||"")) { ch.setAttribute("target","_blank"); ch.setAttribute("rel","noopener"); } else ch.removeAttribute("target"); }
      walk(ch);
    });
  };
  const root = doc.body.firstChild; walk(root); return root.innerHTML;
}
const textToHtml = t => String(t||"").trim() ? String(t).trim().split(/\n{2,}/).map(par => `<p>${esc(par).replace(/\n/g,"<br>")}</p>`).join("") : "";
const stripHtml = h => { const d = document.createElement("div"); d.innerHTML = sanitize(h); return d.textContent || ""; };

function inl(t){ return esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>"); }
function renderRich(src){
  const secs = []; let sec = null, card = null;
  const newSec = (eb,title) => { sec = {eb,title,paras:[],quotes:[],list:[],cards:[],rows:[],after:[]}; secs.push(sec); card = null; };
  String(src||"").split("\n").forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (l.startsWith("## ")){ const [a,...b] = l.slice(3).split("|"); newSec(b.length?a.trim():"", (b.length?b.join("|"):a).trim()); return; }
    if (!sec) newSec("","");
    if (l.startsWith("### ")){ card = {title:l.slice(4).trim(), list:[], paras:[]}; sec.cards.push(card); return; }
    if (l.startsWith("|")){ card = null; sec.rows.push(l.replace(/^\||\|$/g,"").split("|").map(c=>c.trim())); return; }
    if (l.startsWith("> ")){ sec.quotes.push(l.slice(2)); return; }
    if (l.startsWith("- ")){ (card ? card.list : sec.list).push(l.slice(2)); return; }
    (card ? card.paras : sec.rows.length ? sec.after : sec.paras).push(l);
  });
  return `<div class="rich">${secs.map(x => {
    const E = x.eb.toUpperCase();
    const kind = /PROCESS|STEP/.test(E) ? "rs-steps" : /FEATURE|특장/.test(E) ? "rs-feat" : /CASE|TARGET|분야/.test(E) ? "rs-case" : "";
    const chipsOnly = kind!=="rs-feat" && x.cards.length && x.cards.every(c => !c.list.length && !c.paras.length);
    const [head, ...body] = x.rows;
    return `<section class="reveal ${kind}">
      ${x.title||x.eb?`<div class="rs-hd">${x.eb?`<p class="eyebrow">${esc(x.eb)}</p>`:""}${x.title?`<h3>${inl(x.title)}</h3>`:""}</div>`:""}
      ${x.quotes.map(q => `<p class="rs-quote">${inl(q)}</p>`).join("")}
      ${x.paras.map(q => `<p class="rs-p">${inl(q)}</p>`).join("")}
      ${x.list.length?`<ul class="rs-list" style="margin-bottom:24px">${x.list.map(i=>`<li>${inl(i)}</li>`).join("")}</ul>`:""}
      ${chipsOnly ? `<div class="rs-chips">${x.cards.map(c=>`<span class="rs-chip">${inl(c.title)}</span>`).join("")}</div>`
        : x.cards.length ? `<div class="rs-cards">${x.cards.map((c,i) => `<div class="rs-card">${kind==="rs-steps"?`<span class="n">STEP ${String(i+1).padStart(2,"0")}</span>`:kind==="rs-feat"?`<span class="n">${String(i+1).padStart(2,"0")}</span>`:""}<h4>${inl(c.title)}</h4>${c.paras.map(q=>`<p>${inl(q)}</p>`).join("")}${c.list.length?`<ul>${c.list.map(i=>`<li>${inl(i)}</li>`).join("")}</ul>`:""}</div>`).join("")}</div>` : ""}
      ${head?`<div class="rs-table"><table><thead><tr>${head.map(h=>`<th>${inl(h)}</th>`).join("")}</tr></thead><tbody>${body.map(r=>`<tr>${r.map(c=>`<td class="${/^[●○X✕-]$/.test(c)?"c":""}">${c==="●"?'<span class="dot">●</span>':inl(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
      ${x.after.map(q => `<p class="note" style="margin-top:16px">${inl(q)}</p>`).join("")}
    </section>`; }).join("")}</div>`;
}

let heroTimer = 0;
function startHero(){
  clearTimeout(heroTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) document.querySelectorAll(".slide video, .film video").forEach(v => { v.removeAttribute("autoplay"); v.pause(); });
  if (ui.heroPaused) return;
  const bar = $("#heroBar"); if (!bar) return; // single slide: no slider controls
  const n = document.querySelectorAll(".slide").length;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  bar.classList.remove("run"); void bar.offsetWidth;
  if (n < 2 || reduce) { bar.style.transform = "scaleX(1)"; return; }
  bar.classList.add("run");
  heroTimer = setTimeout(() => goSlide(ui.slide+1), 6000);
}
function goSlide(i){
  const slides = document.querySelectorAll(".slide"); const n = slides.length; if (!n) return;
  ui.slide = (i+n)%n;
  slides.forEach((s,k) => { s.classList.toggle("on", k===ui.slide); s.setAttribute("aria-hidden", k!==ui.slide); });
  const c = $(".hero-ctrl .cur"); if (c) c.textContent = String(ui.slide+1).padStart(2,"0");
  startHero();
}
let io;
function observe(){
  io && io.disconnect();
  io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return; const el = e.target; io.unobserve(el);
    el.classList.add("in");
    el.querySelectorAll("[data-count]").forEach(countUp);
  }), {threshold:.2});
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
}
function countUp(el){
  const to = parseFloat(el.dataset.count); if (isNaN(to) || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const comma = el.dataset.fmt==="comma"; const t0 = performance.now(), dur = 1600;
  const f = t => { const p = Math.min(1,(t-t0)/dur), v = Math.round(to*(1-Math.pow(1-p,3)));
    el.textContent = comma ? v.toLocaleString("en-US") : v; if (p<1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
function maybePopups(){

function wireTrack(){
  const tr = $("#pTrack"), cnt = $("#pCnt"); if (!tr || !cnt) return;
  const n = tr.children.length;
  tr.addEventListener("scroll", () => { const w = (tr.querySelector(".p-card")?.offsetWidth||400)+24; cnt.textContent = String(Math.min(n, Math.round(tr.scrollLeft/w)+1)).padStart(2,"0")+" / "+String(n).padStart(2,"0"); }, {passive:true});
  let down=false, sx=0, sl=0, moved=false;
  tr.addEventListener("pointerdown", e => { if (e.pointerType!=="mouse") return; down=true; moved=false; sx=e.clientX; sl=tr.scrollLeft; tr.style.scrollSnapType="none"; });
  window.addEventListener("pointermove", e => { if(!down) return; const d=e.clientX-sx; if(Math.abs(d)>4) moved=true; tr.scrollLeft = sl-d; });
  window.addEventListener("pointerup", () => { if(!down) return; down=false; tr.style.scrollSnapType=""; });
  tr.addEventListener("click", e => { if (moved){ e.preventDefault(); moved=false; } }, true);
}

let lastRoute = null;
function render(routeChanged){
  const r = route();
  renderHeader(r);

  if (r.split("-")[0]==="admin"){ renderAdmin(r); $("#editFab")?.remove(); renderPreviewBar(); lastRoute = r; return; }
  const keepY = !routeChanged && lastRoute===r ? window.scrollY : 0;
  const trackX = $("#pTrack")?.scrollLeft || 0;
  let html;
  if (r==="home") html = viewHome();
  else if (r==="about") html = viewAbout();
  else if (r==="business" || r.startsWith("business-")) html = viewBusiness(r.slice(9));
  else if (r==="products") html = viewProducts();
  else if (r==="cert") html = viewWorks();
  else if (r.startsWith("product-")) html = viewProduct(r.slice(8));
  else if (r==="news") html = viewNews();
  else if (r==="contact") html = viewContact();
  else if (r.startsWith("post-")) html = viewPost(r.slice(5));
  else html = viewHome();
  const notice = S.timedOut && !S.loaded ? `<div class="notice-bar" style="position:relative;z-index:55;margin-top:88px">콘텐츠를 아직 불러오지 못했습니다. 연결 상태를 확인해 주세요.</div>` : "";

  document.documentElement.lang = ui.lang;
  document.title = ui.lang==="en" ? "TrizN" : "트리즈엔";
  if (r==="home"){ startHero(); wireTrack(); const tr=$("#pTrack"); if (tr && trackX) tr.scrollLeft = trackX; } else clearTimeout(heroTimer);
  observe();
  if (routeChanged) window.scrollTo(0,0); else if (keepY) window.scrollTo(0,keepY);

async function publishMany(list){
  let ok = 0;
  for (const d of list){ try { await publishDraft(d); ok++; } catch(err){ toast(dbErr(err), true); break; } }
  if (ok) toast(ok === 1 ? "반영했습니다. 방문자에게도 보입니다." : `${ok}건을 반영했습니다. 방문자에게도 보입니다.`);
}
async function dropDraft(d){ try { await db.doc("drafts/" + d.id).delete(); toast("반영 대기 중인 변경을 취소했습니다."); } catch(err){ toast(dbErr(err), true); } }
function draftLink(d){ if (d.col==="site") return "#home"; const f = SITE_LINK[d.col]; return f ? f({id:d.docId, ...d.data}) : "#home"; }
document.addEventListener("click", async e => {
  const t = e.target;
  if (t.closest("[data-pvon]")){ setPreview(true); return; }
  if (t.closest("[data-pvoff]")){ ui.pvOpen = false; setPreview(false); return; }
  if (t.closest("[data-pvlist]")){ ui.pvOpen = !ui.pvOpen; renderPreviewBar(); return; }
  if (t.closest("[data-pvall]")){ ui.pvOpen = false; await publishMany(myDrafts()); return; }
  const go = t.closest("[data-pvgo]"); if (go){ const d = S.drafts.find(x => x.id===go.dataset.pvgo); if (d){ ui.pvOpen = false; if (!ui.preview) { ui.preview = true; store.set("tz-preview","1",sessionStorage); } location.hash = draftLink(d); render(true); } return; }
  const pub = t.closest("[data-pvpub]"); if (pub){ const d = S.drafts.find(x => x.id===pub.dataset.pvpub); if (d) await publishMany([d]); return; }
  const drop = t.closest("[data-pvdrop]"); if (drop){ const d = S.drafts.find(x => x.id===drop.dataset.pvdrop); if (d) await dropDraft(d); return; }
});

async function persistOrder(c, list, flashId){
  // optimistic local update, then write only documents whose order changed
  const changed = [];
  list.forEach((x,i) => { const o = i*10; if (x.order !== o){ changed.push([x.id,o]); const ref = S[c].find(y=>y.id===x.id); if (ref) S[c] = S[c].map(y => y.id===x.id ? {...y, order:o} : y); } });
  render(false);
  if (flashId) document.querySelector(`.s-row[data-id="${CSS.escape(flashId)}"]`)?.classList.add("flash");
  if (!db || !changed.length) return;
  try { for (const [id,o] of changed) await db.doc(`${c}/${id}`).update({order:o}); toast("순서를 저장했습니다. 홈페이지에 반영되었습니다."); }

}
function reorder(c, fromId, toId, before){
  const list = currentList(c); const from = list.findIndex(x=>x.id===fromId); if (from<0) return;

  persistOrder(c, list, fromId);
}

/* ---- in-browser video compression (for files over 20MB) ---- */
const vzFiles = new Map();
const MAXBPS = {1920:6e6, 1280:3.5e6, 854:1.8e6};
const TARGET_BITS = 18.5*1024*1024*8; // compressed target stays under the claude.ai 20MB limit
const fmtDur = s => `${Math.floor(s/60)}분 ${Math.round(s%60)}초`;
function vzPlan(box){
  const vz = box.querySelector(".vz"), f = vzFiles.get(vz.dataset.key);
  const audio = vz.querySelector("[data-vzmode]").value==="play", len = +vz.querySelector("[data-vzlen]").value, w = +vz.querySelector("[data-vzw]").value;
  const d = len ? Math.min(len, f.dur) : f.dur;
  const vbps = Math.min(MAXBPS[w], TARGET_BITS/d - (audio?128e3:0));
  return {audio, d, w, vbps};
}
function vzEstimate(box){
  const {d, vbps} = vzPlan(box); const el = box.querySelector(".vz-est");
  const q = vbps >= 2.5e6 ? "좋음" : vbps >= 1.2e6 ? "보통" : "낮음";
  el.innerHTML = `예상: ${fmtDur(d)} · 약 ${(vbps/1e6).toFixed(1)}Mbps · 화질 <b>${q}</b> · 압축에 약 ${fmtDur(d)} 걸립니다.${q==="낮음"?` <span class="warn">길이를 줄이거나 해상도를 낮추세요. 긴 영상은 유튜브 주소로 연결하는 편이 낫습니다.</span>`:""}`;
}
function showCompress(box, key, file){
  box.querySelector(".vz")?.remove();
  const url = URL.createObjectURL(file); const probe = document.createElement("video"); probe.preload = "metadata"; probe.src = url;
  const isPlay = key==="filmVideoId";
  box.insertAdjacentHTML("beforeend", `<div class="vz" data-key="${key}"><b>${esc(file.name)} · ${(file.size/1048576).toFixed(0)}MB</b>
    <p>한 파일은 ${MAX_LABEL()}까지 올릴 수 있어서 그대로는 올라가지 않습니다. 이 브라우저에서 바로 압축한 뒤 올릴 수 있습니다.</p>
    <div class="row"><label>용도 <select data-vzmode><option value="loop" ${isPlay?"":"selected"}>배경용 · 소리 없음</option><option value="play" ${isPlay?"selected":""}>재생용 · 소리 포함</option></select></label>
    <label>길이 <select data-vzlen><option value="15">앞 15초</option><option value="30" ${isPlay?"":"selected"}>앞 30초</option><option value="60">앞 1분</option><option value="0" ${isPlay?"selected":""}>전체</option></select></label>
    <label>해상도 <select data-vzw><option value="1920">1080p</option><option value="1280" selected>720p</option><option value="854">480p</option></select></label></div>
    <p class="vz-est note">영상 정보를 읽는 중…</p>
    <div class="row"><button type="button" class="abtn pri" data-vzgo disabled>압축 후 업로드</button><button type="button" class="abtn" data-vzcancel>취소</button></div>
    <div class="pbar" hidden><i></i></div><p class="vz-msg note"></p></div>`);
  probe.onloadedmetadata = () => { vzFiles.set(key, {file, dur:probe.duration, vw:probe.videoWidth, vh:probe.videoHeight}); URL.revokeObjectURL(url); box.querySelector("[data-vzgo]").disabled = false; vzEstimate(box); };
  probe.onerror = () => { box.querySelector(".vz-est").textContent = "이 영상 형식은 브라우저에서 열 수 없습니다. MP4(H.264)로 바꿔서 다시 시도하세요."; };
}
async function compressVideo(f, {audio, d, w, vbps}, onProgress){
  if (!window.MediaRecorder) throw new Error("이 브라우저는 영상 압축을 지원하지 않습니다. 크롬이나 엣지에서 다시 시도하세요.");
  const url = URL.createObjectURL(f.file); const v = document.createElement("video");
  v.src = url; v.playsInline = true; v.preload = "auto"; v.muted = !audio; v.crossOrigin = "anonymous";
  await new Promise((res, rej) => { v.oncanplay = res; v.onerror = () => rej(new Error("영상을 열 수 없습니다.")); });
  const scale = Math.min(1, w / f.vw); const cw = Math.round(f.vw*scale/2)*2, ch = Math.round(f.vh*scale/2)*2;
  const cv = document.createElement("canvas"); cv.width = cw; cv.height = ch; const ctx = cv.getContext("2d");
  const stream = cv.captureStream(30); let actx = null;
  if (audio){ try { actx = new AudioContext(); const src = actx.createMediaElementSource(v); const dst = actx.createMediaStreamDestination(); src.connect(dst); dst.stream.getAudioTracks().forEach(t => stream.addTrack(t)); } catch {} }
  const mime = ["video/mp4;codecs=avc1,mp4a.40.2","video/mp4;codecs=avc1","video/mp4","video/webm;codecs=vp9,opus","video/webm;codecs=vp9","video/webm;codecs=vp8,opus","video/webm"].find(m => MediaRecorder.isTypeSupported(m));
  if (!mime) throw new Error("이 브라우저에서 쓸 수 있는 영상 형식이 없습니다.");
  const rec = new MediaRecorder(stream, {mimeType:mime, videoBitsPerSecond:Math.round(vbps), audioBitsPerSecond:128000});
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const stopped = new Promise(r => rec.onstop = r);
  let done = false;
  const stop = () => { if (done) return; done = true; v.pause(); if (rec.state !== "inactive") rec.stop(); };
  const tick = () => { if (done) return; ctx.drawImage(v, 0, 0, cw, ch); onProgress(Math.min(1, v.currentTime / d)); if (v.currentTime >= d || v.ended) { stop(); return; } v.requestVideoFrameCallback ? v.requestVideoFrameCallback(tick) : requestAnimationFrame(tick); };
  v.onended = stop;
  rec.start(1000); await v.play(); tick();
  await stopped; URL.revokeObjectURL(url); actx?.close();
  const type = mime.split(";")[0];
  return new File([new Blob(chunks, {type})], f.file.name.replace(/\.[^.]+$/, "") + (type==="video/mp4"?".mp4":".webm"), {type});
}
document.addEventListener("change", e => { const vz = e.target.closest(".vz"); if (vz && e.target.matches("select")) vzEstimate(vz.closest(".img-field")); });
document.addEventListener("click", async e => {
  const vz = e.target.closest(".vz"); if (!vz) return;
  const box = vz.closest(".img-field"), key = vz.dataset.key;
  if (e.target.closest("[data-vzcancel]")){ vz.remove(); vzFiles.delete(key); return; }

  msg.textContent = "압축 중입니다. 끝날 때까지 이 탭을 열어 두세요.";
  try {
    const out = await compressVideo(f, plan, p => { bar.firstElementChild.style.width = (p*100).toFixed(1)+"%"; });
    if (out.size > MAX_UP()) throw new Error(`압축 결과가 ${(out.size/1048576).toFixed(1)}MB라 ${MAX_LABEL()}를 넘었습니다. 길이를 줄이거나 해상도를 낮춰 다시 시도하세요.`);

    const r = await assets.upload(out);
    box.querySelector(`[data-imgval="${key}"]`).value = r.id;
    box.querySelector(".prev").innerHTML = `<video src="${r.url}" muted loop autoplay playsinline style="width:100%;height:100%;object-fit:cover"></video>`;
    box.querySelector(".help").textContent = "업로드 완료 · 저장하면 반영됩니다.";

  } catch(err){

render(true);
(async () => {
  const C = window.claude; if (!C || !C.use){ S.timedOut = true; render(false); return; }
  const timer = setTimeout(() => { if (!S.loaded){ S.timedOut = true; schedule(); } }, 10000);
  try { user = await C.use("user"); } catch {}
  try { db = await C.use("db"); } catch {}
  if (user){ try { canEdit = await user.canEdit(); } catch {} try { myId = await user.id(); } catch {} }
  if (SRV && user?.me){ try { me = await user.me(); perms = me ? (me.perms || []) : []; } catch {} }
  if (canEdit){ try { assets = await C.use("assets"); } catch {} }
  if (!db){ clearTimeout(timer); S.timedOut = true; schedule(); return; }
  let pending = COLS.length + 1;
  const done = (snap) => { if (snap && snap.metadata && !snap.metadata.fromCache && !S.loaded && --pending <= 0){ S.loaded = true; clearTimeout(timer); } };
  const fail = () => { S.timedOut = true; clearTimeout(timer); schedule(); };
  COLS.forEach(c => db.collection(c).onSnapshot(snap => { S[c] = snap.docs.map(d => ({id:d.id, ...d.data()})); done(snap); schedule(); }, fail));
  db.doc("site/config").onSnapshot(snap => { S.config = snap.exists ? snap.data() : {}; done(snap); schedule(); }, fail);
  if (canEdit) db.collection("drafts").onSnapshot(snap => { S.drafts = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, () => {});
  if (canEdit && canSec("inquiries")) db.collection("inquiries").onSnapshot(snap => { S.inquiries = snap.docs.map(d => ({id:d.id, ...d.data()})); schedule(); }, () => {});
})();
